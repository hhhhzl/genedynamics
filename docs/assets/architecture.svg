  <rect x="48" y="736" width="1344" height="110" rx="14" fill="#E8EFEE" stroke="#D1DFDC" class="box"/>
  <text x="70" y="773" class="mono eyebrow">04 / OBSERVE + ITERATE</text>
  <text x="70" y="815" class="sans" font-size="19" fill="#254B46">Resolved configs</text>
