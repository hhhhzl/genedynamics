<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="756" viewBox="0 0 1440 756" role="img" aria-labelledby="title desc">
  <title id="title">Generative models for robot learning, planning and control</title>
  <desc id="desc">Learning produces policy priors, trajectory diffusion models and reliability estimates. Generative inference uses the selected models alongside task dynamics, objectives, geometry and constraints. Controllers execute trajectories in simulation or on robots, with measured-state feedback for replanning. Execution traces support offline training and calibration. Learned checkpoints are optional for model-based planners.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L8 5L0 9" fill="none" stroke="#648B88" stroke-width="1.5"/></marker>
    <style>
      .sans {font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
      .mono {font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
      .eyebrow {font-size:13px;letter-spacing:1.4px;fill:#39786C}
      .heading {font-size:40px;font-weight:650;fill:#12232D}
      .label {font-size:26px;font-weight:650;fill:#12232D}
      .body {font-size:19px;fill:#536A76}
      .small {font-size:16px;fill:#536A76}
      .box {stroke-width:1.4}
      .learning {fill:#F3EFFF;stroke:#C5B5F4}
      .task {fill:#EAF3FF;stroke:#A8C6ED}
      .execution {fill:#FFF0EF;stroke:#E9B4AF}
      .flow {fill:none;stroke:#648B88;stroke-width:1.8;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1440" height="756" rx="16" fill="#F3F6F7"/>
  <text x="64" y="48" class="mono eyebrow">GENERATIVE ROBOTICS</text>
  <text x="63" y="105" class="sans heading">Learn. Generate. Act.</text>
  <text x="64" y="143" class="sans body">Shared interfaces connect learned models, physics and closed-loop execution.</text>

  <rect x="64" y="196" width="328" height="180" rx="14" class="box learning"/>
  <text x="88" y="228" class="mono eyebrow">TRAIN + REUSE</text>
  <text x="88" y="267" class="sans label">Learning</text>
  <text x="88" y="301" class="sans body">PPO / SAC policies</text>
  <text x="88" y="328" class="sans body">Trajectory diffusion models</text>
  <text x="88" y="355" class="sans body">Task-specific reliability</text>
  <text x="408" y="223" class="sans small">Models / priors</text>
  <path d="M392 286H471" class="flow"/>

  <rect x="64" y="414" width="328" height="154" rx="14" class="box task"/>
  <text x="88" y="446" class="mono eyebrow">DEFINE + SIMULATE</text>
  <text x="88" y="485" class="sans label">Robot + task</text>
  <text x="88" y="519" class="sans body">Dynamics · objectives · geometry</text>
  <text x="88" y="546" class="sans body">Environment + physics adapters</text>
  <path d="M392 490H432V425H471" class="flow"/>

  <rect x="480" y="240" width="448" height="264" rx="14" fill="#112B32"/>
  <text x="506" y="275" class="mono" font-size="13" letter-spacing="1.4" fill="#8CE4CF">GENERATIVE INFERENCE</text>
  <text x="506" y="320" class="sans" font-size="28" font-weight="650" fill="#F1F5F7">Planning + refinement</text>
  <text x="506" y="360" class="sans" font-size="18" fill="#B2C7CB">Learned diffusion · model-based inference</text>
  <text x="506" y="390" class="sans" font-size="18" fill="#B2C7CB">Policy proposals + dynamics rollouts</text>
  <text x="506" y="420" class="sans" font-size="18" fill="#B2C7CB">Geometry · constraints · reverse transports</text>
  <path d="M506 444H902" stroke="#375158"/>
  <text x="506" y="476" class="sans" font-size="17" fill="#8CE4CF">MDOC · MD-COAS · 2GO · MGA + baselines</text>

  <path d="M928 368H1015" class="flow"/>
  <text x="946" y="348" class="sans small">Plans</text>
  <rect x="1024" y="240" width="352" height="264" rx="14" class="box execution"/>
  <text x="1048" y="275" class="mono eyebrow">CLOSED-LOOP EXECUTION</text>
  <text x="1048" y="320" class="sans label">Controllers + robot I/O</text>
  <text x="1048" y="360" class="sans body">Followers + safety filters</text>
  <text x="1048" y="390" class="sans body">Simulation or robot execution</text>
  <path d="M1048 416H1352" stroke="#E9C4C1"/>
  <text x="1048" y="451" class="sans body">Receding-horizon control</text>
  <text x="1048" y="478" class="sans small">Recipe-specific execution adapters</text>
  <path d="M1200 504V568H704V513" class="flow"/>
  <text x="886" y="554" class="sans small">Measured state feeds the next replan</text>

  <path d="M1308 504V615" class="flow"/>
  <rect x="64" y="624" width="1312" height="100" rx="14" fill="#EDF8F3" stroke="#A6D8C4" stroke-width="1.4"/>
  <text x="88" y="656" class="mono eyebrow">DATA + EVALUATION</text>
  <text x="88" y="694" class="sans" font-size="19" fill="#254B46">Resolved configs</text>
  <text x="310" y="694" class="sans" font-size="19" fill="#254B46">Trajectories + traces</text>
  <text x="590" y="694" class="sans" font-size="19" fill="#254B46">Metrics + replay</text>
  <text x="840" y="694" class="sans" font-size="19" fill="#254B46">Offline training + calibration</text>
  <path d="M64 674H32V286H55" class="flow" stroke-dasharray="5 6"/>
  <text x="22" y="550" transform="rotate(-90 22 550)" class="mono eyebrow">OFFLINE FEEDBACK</text>
  <text x="64" y="603" class="sans small">Choose components per workflow. Model-based planners can run without learned checkpoints.</text>
</svg>
