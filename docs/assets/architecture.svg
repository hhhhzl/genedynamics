  <text x="47" y="98" class="sans heading">From task definition to robot execution.</text>
  <text x="48" y="136" class="sans" font-size="19" fill="#536A76">Learn reusable models. Compose solvers. Run, deploy and evaluate.</text>

  <rect x="356" y="204" width="286" height="140" rx="14" fill="#F3EFFF" stroke="#C5B5F4" class="box"/>
  <text x="378" y="240" class="sans label">Learning + models</text>
  <text x="378" y="274" class="sans body">Policy + diffusion training</text>
  <text x="378" y="300" class="sans" font-size="16.5" fill="#536A76">Checkpoints + horizon priors</text>
  <text x="378" y="326" class="sans" font-size="16.5" fill="#536A76">Reliability fit + calibration</text>
  <path d="M614 344V373" class="flow"/>
  <text x="378" y="367" class="sans small">Models + priors</text>

  <rect x="356" y="382" width="286" height="116" rx="14" fill="#EAF3FF" stroke="#A8C6ED" class="box"/>
  <text x="378" y="419" class="sans label">Planner plugins</text>
  <text x="378" y="451" class="sans" font-size="16.5" fill="#536A76">Diffusion · MPC · optimization</text>
  <text x="378" y="479" class="sans body">Shared solver contracts</text>

  <rect x="356" y="544" width="286" height="116" rx="14" fill="#FFF7E6" stroke="#E6C97E" class="box"/>
  <text x="378" y="581" class="sans label">Constraints</text>
  <text x="378" y="613" class="sans body">Manifolds · CBF · CFS</text>
  <text x="378" y="641" class="sans" font-size="16.5" fill="#536A76">Solvers + adaptive schedules</text>
  <path d="M614 544V507" class="flow"/>
  <text x="378" y="530" class="sans small">Geometry + corrections</text>

  <rect x="48" y="382" width="252" height="278" rx="14" fill="#EDF8F3" stroke="#A6D8C4" class="box"/>
  <text x="70" y="417" class="mono eyebrow">01 / DEFINE</text>
  <text x="70" y="456" class="sans label">Robot + task</text>
  <text x="70" y="499" class="sans body">State + action semantics</text>
  <text x="70" y="531" class="sans body">Dynamics + objectives</text>
  <text x="70" y="563" class="sans body">Scene + geometry</text>
  <path d="M70 593H278" stroke="#C2DDCF"/>
