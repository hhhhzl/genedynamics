<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="808" viewBox="0 0 1440 808" role="img" aria-labelledby="title desc">
  <title id="title">Generative dynamics on manifold: Planning, Control, Learning</title>
  <desc id="desc">Planning, Control and Learning are three equal pillars. Learned models and priors feed generative planning. Control executes plans and returns measured state. Traces and outcomes support explicit offline learning and calibration. Robot tasks, dynamics, constraint manifolds, geometry and simulation adapters form the shared platform.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L8 5L0 9" fill="none" stroke="#648B88" stroke-width="1.5"/></marker>
    <style>
      .sans {font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
      .mono {font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
      .eyebrow {font-size:13px;letter-spacing:1.4px;fill:#39786C}
      .heading {font-size:40px;font-weight:650;fill:#12232D}
      .pillar {font-size:36px;font-weight:650;fill:#12232D}
      .label {font-size:23px;font-weight:600;fill:#25414D}
      .body {font-size:19px;fill:#536A76}
      .small {font-size:17px;fill:#536A76}
      .flow {fill:none;stroke:#648B88;stroke-width:1.8;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1440" height="808" rx="18" fill="#F3F6F7"/>
  <text x="64" y="46" class="mono eyebrow">GENERATIVEDYNAMICS</text>
  <text x="63" y="100" class="sans heading">Generative dynamics on manifold.</text>
  <text x="64" y="138" class="sans body">For robotics. Planning. Control. Learning.</text>

  <path d="M1176 222V184H264V213" class="flow"/>
  <text x="594" y="173" class="sans small">Learned models + priors</text>

  <rect x="64" y="222" width="400" height="266" rx="16" fill="#EAF3FF" stroke="#A8C6ED" stroke-width="1.4"/>
  <text x="88" y="257" class="mono eyebrow">01 / GENERATE + REFINE</text>
  <text x="88" y="308" class="sans pillar">Planning</text>
  <text x="88" y="354" class="sans label">Generative inference</text>
  <text x="88" y="395" class="sans body">Diffusion + model-based refinement</text>
  <text x="88" y="425" class="sans body">Constraint-aware trajectories</text>
  <path d="M88 446H440" stroke="#C5D8EE"/>
  <text x="88" y="473" class="sans small">MDOC · MD-COAS · 2GO · MGA</text>

  <path d="M464 354H511" class="flow"/>
  <rect x="520" y="222" width="400" height="266" rx="16" fill="#FFF0EF" stroke="#E9B4AF" stroke-width="1.4"/>
  <text x="544" y="257" class="mono eyebrow">02 / EXECUTE + OBSERVE</text>
  <text x="544" y="308" class="sans pillar">Control</text>
  <text x="544" y="354" class="sans label">Closed-loop execution</text>
  <text x="544" y="395" class="sans body">Motion–impedance + safety filters</text>
  <text x="544" y="425" class="sans body">Controllers · followers · robot I/O</text>
  <path d="M544 446H896" stroke="#E9C4C1"/>
  <text x="544" y="473" class="sans small">Receding-horizon execution</text>

  <rect x="976" y="222" width="400" height="266" rx="16" fill="#F3EFFF" stroke="#C5B5F4" stroke-width="1.4"/>
  <text x="1000" y="257" class="mono eyebrow">03 / TRAIN + REUSE</text>
  <text x="1000" y="308" class="sans pillar">Learning</text>
  <text x="1000" y="354" class="sans label">Models + reusable priors</text>
  <text x="1000" y="395" class="sans body">PPO / SAC + diffusion training</text>
  <text x="1000" y="425" class="sans body">Checkpoints + horizon proposals</text>
  <path d="M1000 446H1352" stroke="#D7CCF0"/>
  <text x="1000" y="473" class="sans small">Offline reliability calibration</text>

  <path d="M720 488V530H264V497" class="flow"/>
  <text x="421" y="517" class="sans small">Measured-state feedback</text>
  <path d="M720 530V550H1392V732H1385" class="flow"/>

  <rect x="64" y="574" width="1312" height="92" rx="14" fill="#112B32"/>
  <text x="88" y="607" class="mono" font-size="13" letter-spacing="1.4" fill="#8CE4CF">SHARED PLATFORM</text>
  <text x="88" y="643" class="sans" font-size="19" fill="#E4EEEE">Robot + task</text>
  <text x="290" y="643" class="sans" font-size="19" fill="#E4EEEE">Dynamics + objectives</text>
  <text x="600" y="643" class="sans" font-size="19" fill="#E4EEEE">Constraint manifolds + geometry</text>
  <text x="1034" y="643" class="sans" font-size="19" fill="#E4EEEE">Simulation adapters</text>

  <rect x="64" y="688" width="1312" height="90" rx="14" fill="#EDF8F3" stroke="#A6D8C4" stroke-width="1.4"/>
  <text x="88" y="720" class="mono eyebrow">EVIDENCE + OFFLINE FEEDBACK</text>
  <text x="88" y="755" class="sans" font-size="19" fill="#254B46">Configs + checkpoints</text>
  <text x="370" y="755" class="sans" font-size="19" fill="#254B46">Trajectories + outcomes</text>
  <text x="684" y="755" class="sans" font-size="19" fill="#254B46">Metrics + replay</text>
  <text x="966" y="755" class="sans" font-size="19" fill="#254B46">Offline training + calibration</text>
  <path d="M1176 688V676H1408V354H1385" class="flow" stroke-dasharray="5 6"/>
</svg>
