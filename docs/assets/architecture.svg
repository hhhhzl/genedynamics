<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="884" viewBox="0 0 1440 884" role="img" aria-labelledby="title desc">
  <title id="title">GenerativeDynamics workflow: define, compose, run, execute and evaluate</title>
  <desc id="desc">Define a robot task and compose planner plugins, learning models, constraints and geometry. Training produces checkpoints and priors for planners; constraints shape the sampled trajectories. Run planning through the direct Python API or ExperimentRunner. Environment adapters connect to simulation. Explicit trajectory adapters connect selected plans to the separate deployment runtime, with controllers, safety filters and robot I/O. Configurations, trajectories, metrics and reports span the workflow; recorded outcomes support offline training and calibration.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L8 5L0 9" fill="none" stroke="#648B88" stroke-width="1.5"/></marker>
    <style>
      .sans {font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
      .mono {font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
      .eyebrow {font-size:13px;letter-spacing:1.3px;fill:#39786C}
      .heading {font-size:38px;font-weight:650;fill:#12232D}
      .label {font-size:25px;font-weight:650;fill:#12232D}
      .body {font-size:17px;fill:#536A76}
      .small {font-size:16px;fill:#536A76}
      .box {stroke-width:1.4}
      .flow {fill:none;stroke:#648B88;stroke-width:1.8;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1440" height="884" rx="18" fill="#F3F6F7"/>
