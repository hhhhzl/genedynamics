  <text x="642" y="815" class="sans" font-size="19" fill="#254B46">Metrics + replay</text>
  <text x="962" y="815" class="sans" font-size="19" fill="#254B46">Reports + checkpoints</text>
  <path d="M48 790H24V176H500V195" class="flow" stroke-dasharray="5 6"/>
  <text x="48" y="166" class="sans small">Offline training + calibration</text>
</svg>
