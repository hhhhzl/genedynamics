  <text x="1114" y="456" class="sans" font-size="24" font-weight="650" fill="#12232D">Deployment runtime</text>
  <text x="1114" y="499" class="sans" font-size="16.5" fill="#536A76">Adapters + trajectory followers</text>
  <text x="1114" y="531" class="sans body">Controllers + safety filters</text>
