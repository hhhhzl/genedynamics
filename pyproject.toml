[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genedynamics"
version = "0.1.0"
description = "Generative dynamics on manifold for robotics planning, control, and learning"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [
  {name = "Zhilin He", email = "zhilinhe@usc.edu"},
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "jax>=0.6.2,<0.7",
  "numpy>=1.26,<3",
  "scipy>=1.13",
  "PyYAML>=6.0.1",
  "tqdm>=4.65",
  "matplotlib>=3.8",
  "imageio>=2.37",
]

[project.optional-dependencies]
optimization = [
  "cvxopt>=1.3.2",
  "jaxopt>=0.8.5",
  "osqp>=0.6.7.post3",
  "qpax>=0.0.9",
]
simulation = [
  "brax>=0.14.1",
  "dm-control>=1.0.14",
  "gymnasium>=0.29.1",
  "mujoco>=3.1.3",
  "mujoco-mjx",
  "pybullet>=3.2.7",
  "trimesh>=4.10.1",
]
manipulator = [
  "jaxlie>=1.4",
  "pin>=2.7",
  "rtree>=1.0",
  "urchin>=0.0.27",
]
d3il = [
  "gin-config>=0.5.0",
  "gym>=0.26.2",
  "gymnasium>=0.29.1",
  "minari>=0.5.3",
  "pybind11>=3.0",
]
torch = [
  "diffusers>=0.36",
  "einops>=0.8.2",
  "qpth",
  "torch>=2.3",
]
reports = [
  "jinja2>=3.1",
  "pandas>=2.2",
  "seaborn>=0.13",
]
deploy = [
  "flatbuffers>=2.0",
  "osqp>=0.6.7.post3",
  "websockets>=12",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
]
all = [
  "brax>=0.14.1",
  "cvxopt>=1.3.2",
  "diffusers>=0.36",
  "dm-control>=1.0.14",
  "einops>=0.8.2",
  "flatbuffers>=2.0",
  "gin-config>=0.5.0",
  "gym>=0.26.2",
  "gymnasium>=0.29.1",
  "jaxlie>=1.4",
  "jinja2>=3.1",
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "minari>=0.5.3",
  "mujoco>=3.1.3",
  "mujoco-mjx",
  "osqp>=0.6.7.post3",
  "pandas>=2.2",
  "pin>=2.7",
  "pybind11>=3.0",
  "pybullet>=3.2.7",
  "qpax>=0.0.9",
  "qpth",
  "rtree>=1.0",
  "seaborn>=0.13",
  "torch>=2.3",
  "trimesh>=4.10.1",
  "urchin>=0.0.27",
  "websockets>=12",
]
dev = [
  "black>=24.3",
  "build>=1.2",
  "flake8>=7",
  "pytest>=8.3,<10",
  "pytest-cov>=5",
  "twine>=5",
]
test = [
  "pytest>=8.3,<10",
  "pytest-cov>=5",
]

[project.scripts]
genedynamics-run = "genedynamics.experiments.runner:main"
genedynamics-deploy = "genedynamics.deploy.runner:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["genedynamics*"]
namespaces = true

[tool.setuptools.package-data]
genedynamics = [
  "**/*.fbs",
  "**/*.html",
  "**/*.j2",
  "**/*.json",
  "**/*.md",
  "**/*.npz",
  "**/*.obj",
  "**/*.pt",
  "**/*.stl",
  "**/*.urdf",
  "**/*.xml",
  "**/*.yaml",
]
