services:
  genedynamics-dev-cpu:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: dev-cpu
    image: genedynamics/dev-cpu:local
    working_dir: /workspace
    stdin_open: true
    tty: true
    command: /bin/bash
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      JAX_PLATFORMS: cpu
      MUJOCO_GL: osmesa
      PYTHONPATH: /workspace/third_party:${PYTHONPATH:-}
    volumes:
      - ..:/workspace
      - genedynamics-pip-cache:/tmp/pip-cache

volumes:
  genedynamics-pip-cache:
