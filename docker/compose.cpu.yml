services:
  genedynamics-dev-cpu:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: dev-cpu
    image: genedynamics/dev-cpu:local
    platform: linux/arm64
    working_dir: /workspace
    stdin_open: true
    tty: true
    command: /bin/bash
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    env_file:
      - env/dev-cpu.env
    environment:
      PYTHONPATH: /workspace/third_party/environments/d3il:${PYTHONPATH:-}
    volumes:
      - ..:/workspace
      - genedynamics-pip-cache:/tmp/pip-cache

volumes:
  genedynamics-pip-cache:
