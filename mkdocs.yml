site_name: GenerativeDynamics
site_description: Generative models for robot learning, planning, and control
repo_url: https://github.com/hhhhzl/genedynamics
repo_name: hhhhzl/genedynamics
docs_dir: docs
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

nav:
  - Overview: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Direct Python example: getting-started/python-api.md
      - First experiment: getting-started/quickstart.md
  - Concepts:
      - Architecture: concepts/architecture.md
  - Guides:
      - Learning and model priors: guides/learning-and-priors.md
      - Configuration: guides/configuration.md
      - Add a plugin: guides/adding-a-plugin.md
  - Recipes:
      - Catalogue: recipes/index.md
      - Planar CPU smoke: recipes/planar-cpu.md
      - Humanoid corridor planning: recipes/humanoid-corridor.md
  - Integrations:
      - D3IL: integrations/d3il.md
  - Reference:
      - Planners and sources: reference/planners.md
      - Environments: reference/environments.md
      - Constraint solvers: reference/constraints.md
      - API surface: api/README.md
      - Compatibility: reference/compatibility.md
      - Metrics and benchmarks: reference/metrics.md
      - Roadmap: reference/roadmap.md
  - Development:
      - Testing: development/testing.md
      - Releasing: development/releasing.md
  - V1 release:
      - Scope: releases/v1_scope.md
      - Checklist: releases/v1_checklist.md
      - Validation evidence: releases/v1_evidence.md

markdown_extensions:
  - admonition
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
