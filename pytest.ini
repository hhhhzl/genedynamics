[pytest]
# Pytest configuration for genedynamics

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = test

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    requires_jax: Test requires JAX
    requires_mujoco: Test requires MuJoCo
    requires_isaac: Test requires Isaac Sim
    requires_gymnasium: Test requires Gymnasium
    requires_brax: Test requires Brax
    requires_trimesh: Test requires trimesh
    requires_scipy: Test requires SciPy
    requires_pybullet: Test requires PyBullet
    requires_pinocchio: Test requires Pinocchio
    performance: Timing or scalability check excluded from normal CI
    docker: Test requires a project Docker image
    gpu: Test requires a supported accelerator
    brax: Test requires Brax (deploy suite)
    isaac_lab: Test requires Isaac Lab (deploy suite)
    optional: Test covers an optional integration

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Coverage (if pytest-cov is installed)
# addopts = --cov=genedynamics --cov-report=html --cov-report=term-missing

# Minimum Python version
minversion = 8.3
