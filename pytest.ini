[pytest]
# Pytest configuration for enerdynamics

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = test

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    requires_jax: Test requires JAX
    requires_mujoco: Test requires MuJoCo
    requires_isaac: Test requires Isaac Sim
    requires_gymnasium: Test requires Gymnasium
    requires_brax: Test requires Brax
    requires_trimesh: Test requires trimesh
    requires_scipy: Test requires SciPy
    requires_pybullet: Test requires PyBullet
    requires_pinocchio: Test requires Pinocchio

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Coverage (if pytest-cov is installed)
# addopts = --cov=enerdynamics --cov-report=html --cov-report=term-missing

# Minimum Python version
minversion = 3.8
