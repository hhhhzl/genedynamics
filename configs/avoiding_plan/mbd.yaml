# MBD offline/open-loop configuration on the AvoidingPlanEnv (no MuJoCo execution).
name: avoiding_plan_mbd_offline
output_dir: results/avoiding_plan/mbd

env_name: avoiding_plan
env_params:
  dt: 0.035
  horizon: 64
  # maximum delta per step (planner action clipping)
  control_limit: 0.05
  # used only for start generation fallback
  p_max: 2.0
  target_xy: [0.4, 0.35]

method: mbd
method_params:
  horizon: 64
  dt: 0.035
  action_limit: 0.05
  Nsample: 1024
  Ndiffuse: 50
  temp_sample: 0.1
  beta0: 1.0e-4
  betaT: 1.0e-2
  show_tqdm: true

# For pure offline planning, keep obstacles disabled.
obstacle_levels: [0]
obstacle_config:
  generator: box2d
  robot_radius: 0.05
  enable_connectivity_check: false
  enable_nonconvexity_check: false

seeds: [0]
backend: jax
device: cpu

metrics:
  - ssr

visualizations:
  - trajectory

metadata:
  description: "Offline/open-loop MBD on AvoidingPlanEnv (no D3IL MuJoCo execution)"
  author: "enerdynamics"


