  formal_experiment: false
  formal_seeds: false
  protocol_status: development
  run_class: development
  protocol: transfer_mechanism_factorial
  cpu_only: true
  physics_episode_cap: 64
  failure_replacement: false
  evaluation_contract: cross-embodiment-mode-correct-v2
  selection_rule: diagnose public-reference phase/guard/progress; no controller adaptation
    during matrix
