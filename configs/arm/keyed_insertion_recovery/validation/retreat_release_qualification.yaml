base: mechanism_factorial.yaml
name: keyed_insertion_recovery_retreat_release_qualification
output_dir: results/arm/keyed_insertion_recovery/validation/retreat_release_qualification
seeds:
- 940520
- 940521
- 940522
- 940523
method_params:
  actor_binding:
    feedback:
      insertion_lead_z_m: 0.01
metadata:
  protocol: transfer_retreat_release_qualification
  physics_episode_cap: 16
  selection_rule: compare legacy and safe-settled retreat release on both modes under the isolated delay-3 gain-1 payload-0.8 condition; retain every fresh failure
suites:
- name: legacy_mode_0
  env_params:
    mode: 0
    mechanism: &condition
      delay_steps: 3
      servo_gain: 1.0
      payload_mass: 0.8
  method_params:
    mode: 0
    actor_binding:
      retreat_release_version: legacy
- name: legacy_mode_1
  env_params:
    mode: 1
    mechanism: *condition
  method_params:
    mode: 1
    actor_binding:
      retreat_release_version: legacy
- name: safe_settled_mode_0
  env_params:
    mode: 0
    mechanism: *condition
  method_params:
    mode: 0
    actor_binding:
      retreat_release_version: safe_settled_v1
- name: safe_settled_mode_1
  env_params:
    mode: 1
    mechanism: *condition
  method_params:
    mode: 1
    actor_binding:
      retreat_release_version: safe_settled_v1
