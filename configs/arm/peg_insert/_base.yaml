  risk_safety_margin: 0.8
  realization_probe_horizon: 3
  realization_probe_eps: 0.04
  atacom_viability_gain: 0.02

method_params:
  Hsample: 8
  Hnode: 4
  Nsample: 64
  Ndiffuse_init: 4
  Ndiffuse: 2
  temp_sample: 0.06
  action_limit: 1.0
  dt: 0.02
  ctrl_dt: 0.02
  seed: 0
  aug_lambda: 2.0
  aug_rho: 80.0

suites:
