    level: wide
    execution_env_params: {level: ood, ood_clearance_range: [0.0015, 0.0015], ood_friction_range: [0.6, 0.6], ood_position_range: 0.0010, ood_angle_range: 0.0122173, ood_solref_time_range: [0.03, 0.03]}
