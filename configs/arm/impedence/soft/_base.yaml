# ── Arm surface-scan · impedance control · SOFT surface ───────────────────────
# Shared base for the SOFT-medium comparison: same task / seeds / horizon / sampling
# budget as rigid, but the contact is COMPLIANT (the probe sinks into the surface under
# the press = real deformation), realized via a softer mjx solref derived from
# `soft_stiffness`. Lower `soft_stiffness` = softer = more deformation. Mirrors the rigid
# tree: `<env>/<role>/<method>.yaml`, `output_dir` mirrors the config path 1:1.
#
# NOTE: `stiffness_mode` is DERIVED from the method (the method's flags own it); do not
# set it in env_params.

task: manipulator_surface_scan

seeds: [0, 1]
n_steps: 14

# env: PandaSurfaceScanEnv, SOFT medium (compliant contact). `level` (surface family) is
# set per-environment by each method yaml.
env_params:
  medium: soft
  soft_stiffness: 1500.0     # soft contact stiffness -> solref (lower = softer = deeper sink)
  dt: 0.02
  f_target: 45.0             # firm scan press (the contact force the controller tracks)
  f_min: 0.0
  f_max: 60.0
  contact_depth: 0.025       # surface this far below the home EE (starts near contact)
  contact_solref: "0.08 1"   # rigid baseline; the env replaces it from soft_stiffness for soft

# sampling budget (DIAL-aligned) — SHARED by ALL methods so the comparison is fair.
method_params:
  Hsample: 16
  Hnode: 4
  Nsample: 2048
  Ndiffuse_init: 10
  Ndiffuse: 2
  temp_sample: 0.06
  action_limit: 1.0
  dt: 0.02
  ctrl_dt: 0.02
  seed: 0
  aug_lambda: 2.0
  aug_rho: 200.0

metrics: [arm_surface_scan]
backend: jax
