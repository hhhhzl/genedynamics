# True-dynamics controllability-aware geometry. The environment estimates a
# frozen local 2x2 action-to-realized-coordinate response with a short MJX probe;
# the existing spline geometry/retraction consumes the resulting target shift.
task: manipulator_surface_scan
seeds: [0, 1]
n_steps: 100

env_params:
  medium: rigid
  dt: 0.02
  # Calibrated execution regime for the spherical probe.  The surface builder
  # aligns reset in the local normal frame; a slight pre-contact avoids an
  # impact transient.  Tangential gravity cancellation + bounded PI reject the
  # cylinder's downhill bias while preserving the normal contact load.
  friction: 0.1
  contact_depth: 0.0193
  k_orient: 0.0
  grav_comp: 0.0
  tangent_grav_comp: 1.0
  ki_tangent: 250.0
  tangent_int_max: 5.0
  d_damp: 30.0
  s_ref_diag: 6.4
  s_scale: 0.5
  f_target: 20.0
  f_min: 0.0
  f_max: 60.0
  scan_rate: 0.0005
  reward_path_scale: 0.0495
  reward_force_scale: 5.0
  w_path: 1.0
  w_F: 1.0
  w_realized_path: 0.0
  metric_acquisition_steps: 10
  metric_path_tolerance: 0.005
  realization_probe_horizon: 5
  realization_probe_eps: 0.02
  realization_compensation_max_coord: 0.05
  realization_control_max_action: 0.25
  realization_control_reg: 0.0001

method_params:
  Hsample: 16
  Hnode: 4
  Nsample: 64
  Ndiffuse_init: 10
  Ndiffuse: 2
  temp_sample: 0.06
  action_limit: 1.0
  dt: 0.02
  ctrl_dt: 0.02
  seed: 0
  aug_lambda: 2.0
  aug_rho: 200.0

metrics: [arm_surface_scan]
backend: jax
