base: _base.yaml
name: issa
method: issa
group: baseline
output_dir: results/arm/impedence/cpu_controllability_geometry/comparison/issa
method_params:
  policy_ckpt: results/arm/impedence/_policies/shared_ppo_seed0.pkl
  # Frozen CPU budget. The upstream-style 20x50 and a 1e-4 8x30 setting both
  # exceeded the external 20-minute trajectory limit. At normalized boundary
  # precision 1e-3, 8x20 reduced the preregistered 10-step projection failure
  # to 10% (from 20--30%) with zero force/contact violation. Its initial
  # Python-dispatched 100-step rollout exceeded the CPU envelope; evaluation
  # now uses the equivalent JAX-native closed-loop scan, so the safer 8-ray
  # budget is retained instead of weakening candidate coverage.
  n_dirs: 8
  n_iters: 20
  adamba_bound: 0.001
  safety_threshold: 0.0
  enforce_absolute: true
