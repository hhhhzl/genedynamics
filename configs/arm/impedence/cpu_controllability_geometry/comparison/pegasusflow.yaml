base: _base.yaml
name: pegasusflow
method: pegasusflow
group: baseline
output_dir: results/arm/impedence/cpu_controllability_geometry/comparison/pegasusflow
method_params:
  # Matched-compute table keeps the shared 2/10 refine budget while using the
  # upstream PegasusFlow optimizer and noise law (native config uses 1/6).
  update_method: avwbfo
  wbfo_gamma: 1.0
  noise_scheduler_type: s2
  noise_shape_fn: linear
  noise_decay_fn: exponential
  noise_sigma: 1.0
  sigma_decay: 0.9
  temp_sample: 0.1
