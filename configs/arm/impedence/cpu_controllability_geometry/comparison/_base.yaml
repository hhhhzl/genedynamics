base: ../rigid_cylinder/_base.yaml

# Frozen CPU comparison protocol. Algorithm YAMLs inherit this file and differ
# only in method/method_params/checkpoint. Seeds 10/11 are disjoint from RL
# training domains and held-out surface seeds 100--104.
n_steps: 100
env_params:
  observation_mode: rl_realized
  realization_control_gain: 0.125
  w_path: 5.0
  w_realized_path: 5.0
  w_realized_progress: 250.0
  deformation_safe: 0.0005
  deformation_scale: 0.001
  w_deformation: 5.0
  w_contact_loss: 5.0
  w_force_violation: 10.0

evaluation:
  training_steps: 2000000
  policy_seed: 0
  seeds: [10, 11]
  n_steps: 100
  environments:
    - name: rigid_cylinder
      level: cylinder
      env_params: {medium: rigid}
    - name: soft_cylinder
      level: cylinder
      env_params:
        medium: soft
        soft_stiffness: 1500.0
        f_target: 18.0
        h_surf_tangential: true
        soft_contact_manifold: true
    - name: soft_unseen
      level: unseen
      env_params:
        medium: soft
        grav_comp: 0.45
        ki_force: 0.25
        f_target: 15.0
        contact_depth: 0.01965
        h_surf_tangential: true
        soft_contact_manifold: true
        s4_stiffness_range: [800.0, 2000.0]
        s4_friction_range: [0.05, 0.2]

