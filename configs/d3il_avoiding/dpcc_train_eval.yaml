name: d3il_avoiding_dpcc_eval
output_dir: results/d3il_avoiding/dpcc

env_name: d3il_avoiding
env_params:
  render: false
  horizon: 8
  dt: 1

method: dpcc
method_params:
  exp: avoiding-d3il
  dpcc_config_path: enerdynamics/solvers/single/dpcc/config/projection_eval.yaml
  loadbase: logs
  dataset: avoiding-d3il
  diffusion_loadpath: diffusion/H8_K20_Dmodels.GaussianDiffusion
  diffusion_epoch: 'best'
  device: cuda
  seed: 5
  horizon: 8
  dt: 1
  batch_size: 4
  max_episode_length: 200
  variant: dpcc-c
  solver: scipy

obstacle_levels: [0]
obstacle_config:
  generator: d3il_avoiding_fixed
  use_d3il_preset: false
  fixed_cylinders:
    - center: [0.52, 0.02]
      radius: 0.035
  enable_connectivity_check: false
  enable_nonconvexity_check: false

seeds: [5]
backend: torch
device: cuda

metrics:
  - ssr
  - episode_outcome

visualizations:
  - trajectory

metadata:
  description: "DPCC eval on D3IL avoiding"
