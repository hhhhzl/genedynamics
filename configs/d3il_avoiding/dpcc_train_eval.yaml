name: d3il_avoiding_dpcc_eval
output_dir: results/d3il_avoiding/dpcc

env_name: d3il_avoiding
env_params:
  render: false
  horizon: 64
  dt: 0.035

method: dpcc
method_params:
  exp: avoiding-d3il
  dpcc_config_path: dpcc/config/projection_eval.yaml
  loadbase: logs
  dataset: avoiding-d3il
  diffusion_loadpath: diffusion
  diffusion_epoch: null
  device: cuda
  seed: 0
  horizon: 64
  dt: 0.035
  batch_size: 8
  max_episode_length: 200
  variant: dpcc
  solver: scipy

obstacle_levels: [0]
obstacle_config:
  generator: box2d
  enable_connectivity_check: false
  enable_nonconvexity_check: false

seeds: [0]
backend: torch
device: cuda

metrics:
  - ssr
  - episode_outcome

visualizations:
  - trajectory

metadata:
  description: "DPCC eval on D3IL avoiding"

