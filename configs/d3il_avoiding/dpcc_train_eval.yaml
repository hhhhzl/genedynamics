name: d3il_avoiding_dpcc_eval
output_dir: results/d3il_avoiding/dpcc

env_name: d3il_avoiding
env_params:
  render: false
  horizon: 64
  dt: 0.035

method: dpcc
method_params:
  exp: avoiding-d3il
  dpcc_config_path: enerdynamics/solvers/single/dpcc/config/projection_eval.yaml
  # 模型路径: /home/lbw/mbd-project/dpcc/logs/avoiding-d3il/diffusion/H8_K20_Dmodels.GaussianDiffusion/
  # 对应 loadbase/dataset/diffusion_loadpath/seed
  loadbase: /home/lbw/mbd-project/dpcc/logs
  dataset: avoiding-d3il
  diffusion_loadpath: diffusion/H8_K20_Dmodels.GaussianDiffusion
  diffusion_epoch: null
  device: cuda
  seed: 5
  horizon: 64
  dt: 0.035
  batch_size: 8
  max_episode_length: 200
  variant: dpcc
  solver: scipy

obstacle_levels: [0]
obstacle_config:
  generator: box2d
  enable_connectivity_check: false
  enable_nonconvexity_check: false

seeds: [5]
backend: torch
device: cuda

metrics:
  - ssr
  - episode_outcome

visualizations:
  - trajectory

metadata:
  description: "DPCC eval on D3IL avoiding"
