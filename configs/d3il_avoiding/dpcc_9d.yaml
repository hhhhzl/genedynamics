name: d3il_avoiding_dpcc_eval_9d
output_dir: results/d3il_avoiding/dpcc_9d

env_name: d3il_avoiding_9d
env_params:
  render: false
  horizon: 8
  dt: 0.035  # 9D uses qdot integration; must match training/sim
  collision_ee_only: true

method: dpcc
method_params:
  exp: avoiding-d3il-9d
  dpcc_config_path: enerdynamics/solvers/single/dpcc/config/projection_eval.yaml
  loadbase: logs
  dataset: avoiding-d3il-9d
  diffusion_loadpath: diffusion/H8_K20_Dmodels.GaussianDiffusion
  diffusion_epoch: 'best'
  device: cuda
  seed: 5 # seed for pretrained model
  horizon: 8
  dt: 0.035
  batch_size: 4
  max_episode_length: 200
  variant: dpcc-c-tightened
  solver: scipy
  # --- Stage A: method-level parity with 4D DPCC ---
  execution: plan_once
  num_modes: 20
  plan_once_chunks: 25
  use_target_line: true
  num_targets: 4
  # --- Align execution behavior with safediffuser_9d_eval.yaml ---
  track_trajectory: true
  tracker_k_xy: 4.0
  tracker_k_joint: 0.1
  tracker_ff_alpha: 0.25

obstacle_levels: [0, 1, 2]
obstacle_config:
  generator: d3il_avoiding_fixed
  use_d3il_preset: true
  obstacle_radius_by_level:
    0: [0.03, 0.03]
    1: [0.04, 0.04]
    2: [0.05, 0.05]
  enable_connectivity_check: false
  enable_nonconvexity_check: false
  robot_radius: 0.01
  success_margin: 0.025
  map_bounds:
    x_min: 0.2
    x_max: 0.8
    y_min: -0.3
    y_max: 0.4
  robot_radius: 0.01

seeds: [0, 1, 2, 3, 4]
backend: torch
device: cuda

metrics:
  - ssr
  - episode_outcome

visualizations:
  - trajectory_modes
  - trajectory
  - diffusion
  - cost

metadata:
  description: "DPCC eval on D3IL avoiding 9D"
