# CFS-MBD full trajectory QP on D3IL avoiding (9D state, 7D qdot) with joint-lift CFS-QP
name: d3il_avoiding_mdcoas
output_dir: results/d3il_avoiding/mdcoas

env_name: d3il_avoiding_9d
env_params:
  render: false
  horizon: 64
  dt: 0.03

method: d3il_unified
obstacle_levels: [0, 1, 2]

method_params:
  solver: cfsmbd_full
  execution: plan_once
  horizon: 64
  dt: 0.03
  action_limit: 0.8
  show_tqdm: true
  num_modes: 20
  mode_strategy: multirun
  use_target_line: true
  num_targets: 4
  max_episode_length: 64
  track_trajectory: true
  tracker_k_joint: 2.0
  tracker_k_xy: 1
  tracker_ff_alpha: 0.2

  # Joint-lift CFS: A = J_xy(q)^T g_xy (7D), trajectory-level QP
  cfs_action_convexifier: cfs_action_joint
  max_constraints_per_point: 8
  constraint_margin: 0.35

obstacle_config:
  generator: d3il_avoiding_fixed
  use_d3il_preset: true
  obstacle_radius_by_level:
    0: [0.03, 0.03]
    1: [0.04, 0.04]
    2: [0.05, 0.05]
  enable_connectivity_check: false
  enable_nonconvexity_check: false
  robot_radius: 0.01
  success_margin: 0.025
  map_bounds:
    x_min: 0.2
    x_max: 0.8
    y_min: -0.3
    y_max: 0.4

seeds: [0, 1, 2, 3, 4]
backend: jax
device: cuda

scheduler_config:
  type: composite
  diffusion_schedulers:
    - type: fixed
      M_k: 64
      T_k: 1e-1
      Ndiffuse: 100
      beta0: 1.0e-4
      betaT: 1.0e-2
  diffusion_merge_strategy: merge
  constraint_schedulers:
    - type: alm_adaptive
      margin: 0.02
      lam0: 0.0
      rho0: 1.0
      nu0: 0.0
      compute_cost_mode: product   # product | linear
      compute_cost_a0: 0.0
      compute_cost_aK: 1.0
      compute_cost_aI: 1.0
      compute_cost_use_qp_gate: false
      compute_budget_B: 8.0
      compute_budget_time_profile: constant   # constant | gaussian_bump
      compute_budget_time_amp: 2.0
      compute_budget_time_mu: 0.5
      compute_budget_time_sigma: 0.2
      eta_nu: 0.05
      nu_max: 0.0

      # Non-monotone ALM (λ forgetting + ρ hysteresis)
      eta_lam_forget: 0.02
      rho_min: 0.5
      rho_tau_hi: 5.0e-4
      rho_tau_lo: 1.0e-4
      rho_gamma_up: 2.0
      rho_gamma_down: 1.5
      rho_good_steps: 5
      gamma: 2.0
      rho_max: 500.0
      kappa: 0.9
      r_tol: 5e-4

      # Non-monotone controller (v_k-based)
      v_signal_mode: rate   # rate | mean
      v_star: 0.0
      v_ema_beta: 0.3
      v_tau_hi: 0.05
      v_tau_lo: 0.01

      # p controller: non-monotone response to dv and v-v*
      eta_p: 2.0
      eta_p_plus: 2.0
      eta_p_minus: 0.3
      eta_c_p: 0.2

      # topK controller
      eta_topK: 10.0
      eta_topK_plus: 10.0
      eta_topK_minus: 2.0
      eta_c_topK: 1.0

      # I controller
      eta_I: 8.0
      eta_I_plus: 8.0
      eta_I_minus: 2.0
      eta_c_I: 1.0

      # eps controller (smaller eps = more accurate)
      eta_eps: 0.01
      eta_eps_plus: 0.01
      eta_eps_minus: 0.003
      eta_c_eps: 0.01

      p_min: 0.0
      p_max: 1.0
      eps_min: 1e-5
      eps_max: 1e-2
      I_min: 1
      I_max: 5
      topK_min: 1
      topK_max: 8
      use_stochastic_gate: true
  constraint_merge_strategy: merge

metrics:
  - ssr
  - episode_outcome

visualizations:
  - trajectory_modes
  - trajectory
  - diffusion
  - cost

metadata:
  description: "MDCOAS traj QP on D3IL avoiding (joint-lift 7D qdot)"
  author: "genedynamics"