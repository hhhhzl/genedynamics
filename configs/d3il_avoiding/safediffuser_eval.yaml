name: d3il_avoiding_safediffuser_eval
output_dir: results/d3il_avoiding/safediffuser

env_name: d3il_avoiding
env_params:
  render: false

method: safediffuser
method_params:
  # Mirror DPCC-style diffuser logdir loading (no conversion step).
  # This should match how DPCC loads checkpoints via `diffuser.utils.load_diffusion(...)`.
  loadbase: logs
  exp: avoiding-d3il
  dataset: avoiding-d3il
  safediffuser_config_path: enerdynamics/solvers/single/safediffuser/config/avoiding_d3il.yaml
  diffusion_loadpath: diffusion/H8_K20_Dmodels.GaussianDiffusion
  diffusion_epoch: 'best'  # or: "best" / an integer like 50000
  seed: 5
  device: cuda
  batch_size: 8
  enable_safety: true
  # Apply CBF/QP invariance on every denoising step (DDPM iteration).
  # (This is separate from `correct_all_steps`, which toggles correcting all trajectory timesteps vs only t=0.)
  correct_all_steps: true
  which_trajectory: 3
  receding_horizon: true
  max_episode_length: 600
  safediffuser_pos_idx: [0,1]
  derive_action_from_states: true
  export_lifted_9d: true

  plan_config: {}

obstacle_levels: [0]
obstacle_config:
  generator: d3il_avoiding_fixed
  use_d3il_preset: true
  obstacle_radius_by_level:
    0: [0.03, 0.025]
    1: [0.04, 0.035]
    2: [0.06, 0.055]
  enable_connectivity_check: false
  enable_nonconvexity_check: false
  map_bounds:
    x_min: 0.2
    x_max: 0.8
    y_min: -0.3
    y_max: 0.4

seeds: [0]
backend: torch
device: cuda

metrics:
  - ssr
  - episode_outcome

visualizations:
  - trajectory


metadata:
  description: "SafeDiffuser eval on D3IL avoiding (DPCC-style diffuser loading + per-denoise-step CBF/QP)"
