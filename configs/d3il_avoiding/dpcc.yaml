name: d3il_avoiding_dpcc_eval
output_dir: results/d3il_avoiding/dpcc

env_name: d3il_avoiding
env_params:
  render: false
  horizon: 8
  dt: 1

method: dpcc
method_params:
  exp: avoiding-d3il
  dpcc_config_path: enerdynamics/solvers/single/dpcc/config/projection_eval.yaml
  loadbase: logs
  dataset: avoiding-d3il
  diffusion_loadpath: diffusion/H8_K20_Dmodels.GaussianDiffusion
  diffusion_epoch: 'best'
  device: cuda
  seed: 5 # seed for pretrained model
  horizon: 8
  dt: 1
  batch_size: 4
  max_episode_length: 200
  variant: dpcc-c-tightened
  solver: scipy
  execution: plan_once
  num_modes: 20
  plan_once_chunks: 25
  use_target_line: true  # target as line in viz (align with model-based baselines)

obstacle_levels: [0, 1, 2]
obstacle_config:
  generator: d3il_avoiding_fixed
  use_d3il_preset: true
  obstacle_radius_by_level:
    0: [0.03, 0.03]
    1: [0.04, 0.04]
    2: [0.05, 0.05]
  enable_connectivity_check: false
  enable_nonconvexity_check: false
  robot_radius: 0.01
  map_bounds:
    x_min: 0.2
    x_max: 0.8
    y_min: -0.3
    y_max: 0.4
  robot_radius: 0.01

seeds: [0, 1, 2, 3, 4]
backend: torch
device: cuda

metrics:
  - ssr
  - episode_outcome

visualizations:
  - trajectory_modes
  - trajectory

metadata:
  description: "DPCC eval on D3IL avoiding"
