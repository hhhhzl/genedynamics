# CFS-MBD full trajectory QP on D3IL avoiding (9D state, 7D qdot) with joint-lift CFS-QP
name: d3il_avoiding_cfsmbd_full
output_dir: results/d3il_avoiding/cfsmbd_full

env_name: d3il_avoiding_9d
env_params:
  render: false
  horizon: 64
  dt: 0.03

method: d3il_unified
obstacle_levels: [2]

method_params:
  solver: cfsmbd_full
  execution: plan_once
  horizon: 64
  dt: 0.03
  action_limit: 0.8
  show_tqdm: true
  num_modes: 20
  mode_strategy: multirun
  use_target_line: true
  num_targets: 4
  max_episode_length: 64
  track_trajectory: true
  tracker_k_joint: 2.0
  tracker_k_xy: 1
  tracker_ff_alpha: 0.2

  # Joint-lift CFS: A = J_xy(q)^T g_xy (7D), trajectory-level QP
  cfs_action_convexifier: cfs_action_joint
  max_constraints_per_point: 8
  constraint_margin: 0.35

obstacle_config:
  generator: d3il_avoiding_fixed
  use_d3il_preset: true
  obstacle_radius_by_level:
    0: [0.03, 0.03]
    1: [0.04, 0.04]
    2: [0.05, 0.05]
  enable_connectivity_check: false
  enable_nonconvexity_check: false
  robot_radius: 0.01
  success_margin: 0.025
  map_bounds:
    x_min: 0.2
    x_max: 0.8
    y_min: -0.3
    y_max: 0.4

seeds: [0]
backend: jax
device: cuda

scheduler_config:
  type: composite
  diffusion_schedulers:
    - type: fixed
      M_k: 64
      T_k: 1e-1
      Ndiffuse: 100
      beta0: 1.0e-4
      betaT: 1.0e-2
  diffusion_merge_strategy: merge
  constraint_schedulers:
    - type: fixed
      margin: 0.02
      qp_gate: true
      qp_prob: 1.0
      topK: 8
      eps: 1e-4
      I_QP: 5
  constraint_merge_strategy: merge

metrics:
  - ssr
  - episode_outcome

visualizations:
  - trajectory_modes
  - trajectory
  - diffusion
  - cost

metadata:
  description: "CFS-MBD full traj QP on D3IL avoiding (joint-lift CFS-QP, 7D qdot)"
  author: "enerdynamics"
