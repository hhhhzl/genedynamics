# MDOC on D3IL avoiding (9D state, 7D qdot) with joint-lift CBF filter
name: d3il_avoiding_mdoc
output_dir: results/d3il_avoiding/mdoc

env_name: d3il_avoiding_9d
env_params:
  render: false
  horizon: 64
  dt: 0.03

method: d3il_unified
obstacle_levels: [0, 1, 2]

method_params:
  solver: mdoc
  execution: plan_once
  horizon: 64
  dt: 0.03
  action_limit: 0.8
  show_tqdm: true
  num_modes: 20
  mode_strategy: multirun
  use_target_line: true
  num_targets: 4
  max_episode_length: 64
  track_trajectory: true
  tracker_k_joint: 2.0
  tracker_k_xy: 1
  tracker_ff_alpha: 0.2

  # Joint-lift CBF (7D qdot): use J_xy(q)^T grad_xy, SDF at pos = state[:2]
  mdoc_constraint_mode: cbf_qp_joint_lift_perstep
  cbf_tau: 0.01
  cbf_eta: 1
  cbf_margin: 0.01
  base_beta: 0.05
  terminal_energy_weight: 160.0
  guide_weight: 20.0

  # Visualization style
  mdoc_viz_style: "cap" # cap | rectangle    
  mdoc_viz_scale: 1.0
  mdoc_viz_band: 1          
  mdoc_viz_use_beta: False
  mdoc_viz_draw_disk: False
  mdoc_viz_draw_grad: False

obstacle_config:
  generator: d3il_avoiding_fixed
  use_d3il_preset: true
  obstacle_radius_by_level:
    0: [0.03, 0.03]
    1: [0.04, 0.04]
    2: [0.05, 0.05]
  enable_connectivity_check: false
  enable_nonconvexity_check: false
  robot_radius: 0.01
  success_margin: 0.024
  map_bounds:
    x_min: 0.2
    x_max: 0.8
    y_min: -0.3
    y_max: 0.4

seeds: [0, 1, 2, 3, 4]
backend: jax
device: cuda

scheduler_config:
  type: composite
  diffusion_schedulers:
    - type: fixed
      M_k: 64
      T_k: 1e-1
      Ndiffuse: 100
      beta0: 1.0e-4
      betaT: 1.0e-2
  diffusion_merge_strategy: merge
  constraint_schedulers:
    - type: fixed
      margin: 0.01
      rho: 10.0
      qp_gate: true
      qp_prob: 1.0
      topK: null
      eps: 1e-4
      I_QP: 10
  constraint_merge_strategy: merge

metrics:
  - ssr
  - episode_outcome

visualizations:
  - trajectory_modes
  - trajectory
  - diffusion
  - cost

metadata:
  description: "MDOC on D3IL avoiding (joint-lift CBF-QP, 7D qdot)"
  author: "genedynamics"
