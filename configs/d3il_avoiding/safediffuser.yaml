name: d3il_avoiding_safediffuser_eval
output_dir: results/d3il_avoiding/safediffuser

env_name: d3il_avoiding
env_params:
  render: false
  horizon: 8
  dt: 1

method: safediffuser
method_params:
  # Mirror DPCC-style diffuser logdir loading (no conversion step).
  loadbase: logs
  exp: avoiding-d3il
  dataset: avoiding-d3il
  safediffuser_config_path: genedynamics/solvers/single/safediffuser/config/avoiding_d3il.yaml
  diffusion_loadpath: diffusion/H8_K20_Dmodels.GaussianDiffusion
  diffusion_epoch: 'best'  # or: "best" / an integer like 50000
  seed: 5 # seed for pretrained model
  device: cuda
  batch_size: 8
  enable_safety: true
  # Apply CBF/QP invariance on every denoising step (DDPM iteration).
  # (This is separate from `correct_all_steps`, which toggles correcting all trajectory timesteps vs only t=0.)
  correct_all_steps: true
  which_trajectory: 0  # ignored when num_modes > 1; best_idx selects best
  receding_horizon: false
  num_modes: 20
  plan_once_chunks: 25
  use_target_line: true   # target as line (plan + viz, align with DPCC)
  num_targets: 4 
  max_episode_length: 200
  safediffuser_pos_idx: [0,1]
  derive_action_from_states: true
  export_lifted_9d: true
  lift_mode: ik  # ik aligns with DPCC 4D post-lift; delta is smoother but not DPCC-parity
  halfspace_variants: [top-left, bottom-right] # which halfspace variants to include (e.g., "top-left", "bottom-right", or both)

  plan_config: {}

obstacle_levels: [0, 1, 2]
obstacle_config:
  generator: d3il_avoiding_fixed
  use_d3il_preset: true
  obstacle_radius_by_level:
    0: [0.03, 0.03]
    1: [0.04, 0.04]
    2: [0.05, 0.05]
  enable_connectivity_check: false
  enable_nonconvexity_check: false
  map_bounds:
    x_min: 0.2
    x_max: 0.8
    y_min: -0.3
    y_max: 0.4
  robot_radius: 0.01
  
seeds: [0, 1, 2, 3, 4]
backend: torch
device: cuda

metrics:
  - ssr
  - episode_outcome

visualizations:
  - trajectory_modes
  - trajectory


metadata:
  description: "SafeDiffuser eval on D3IL avoiding (plan once + multi-mode, aligned with DPCC)"
