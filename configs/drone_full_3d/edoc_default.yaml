# Unified EDOC experiment configuration for drone_full_3d environment
# Supports multiple physics backends (drone_model, mujoco, isaac) and renderers
name: drone_full_3d_edoc_default
output_dir: results/drone_full_3d/edoc

# Environment configuration
env_name: drone_full_3d_physics
env_params:
  # === Physics Backend Selection ===
  # Options: 'drone_model', 'mujoco', 'isaac', None
  # - 'drone_model': Use DroneModel (NumPy-based, default)
  # - 'mujoco': Use MuJoCo physics engine
  # - 'isaac': Use Isaac Sim physics engine
  # - None: Pure JAX mode (no physics backend)
  physics_backend: drone_model
  use_physics_backend: true
  
  # === Renderer Selection ===
  # Options: 'matplotlib', 'mujoco', 'isaac', None
  # - 'matplotlib': 2D/3D Matplotlib visualization (default)
  # - 'mujoco': MuJoCo interactive viewer
  # - 'isaac': Isaac Sim rendering
  # - None: No rendering
  renderer: matplotlib
  
  # === JAX Configuration ===
  # Use JAX-native dynamics for planning (high performance)
  use_jax_dynamics: true
  jax_jit: true  # Enable JIT compilation for JAX functions
  jax_batch_size: 256  # Batch size for parallel computation
  
  # === Model Paths (optional, set by specific backends) ===
  model_path_mujoco: assets/drone_quadrotor.xml
  model_path_isaac: assets/drone_quadrotor.usd
  
  # === Environment Parameters ===
  dt: 0.01
  horizon: 80
  p_max: 2.0
  v_max: 2.0
  control_limit: 1.0
  target: [0.0, 0.0, 1.0]
  vel_weight: 0.1
  orientation_weight: 0.1
  
  # === Physical Parameters ===
  mass: 0.5
  Ixx: 0.0023
  Iyy: 0.0023
  Izz: 0.0046
  arm_length: 0.17
  kf: 3.16e-10
  km: 7.94e-12
  gravity: 9.81

# Planning method configuration
method: edoc
method_params:
  action_diffuse_steps: 100
  action_nsample: 512
  use_antithetic: true
  action_score_mode: energy
  terminal_energy_weight: 50.0

# Obstacle configuration
obstacle_levels: [0, 1, 2, 3, 4, 5]
obstacle_config:
  generator: box3d
  robot_radius: 0.1
  obstacle_radius_scale: 1.3
  p_max: 2.0
  obstacle_type: sphere  # "sphere" or "box"
  map_bounds:
    x_min: -1.5
    x_max: 1.5
    y_min: -1.5
    y_max: 1.5
    z_min: 0.0
    z_max: 2.0

# Random seeds
seeds: [0, 1, 2]

# Computational backend
# Options: 'numpy', 'jax'
# - 'numpy': NumPy backend (compatible with all physics backends)
# - 'jax': JAX backend (requires use_jax_dynamics=true for best performance)
backend: jax
device: cpu  # Options: 'cpu', 'gpu' (for JAX backend)

# Metrics to compute
metrics:
  - ssr
  - obstacle_density

# Visualizations
visualizations:
  - trajectory_3d
  - diffusion_3d
  - energy_reward
  - states

# Constraint configuration
constraint_config:
  soft_constraint:
    enabled: true
    alpha: 1.0
    beta: 10.0
  hard_constraint:
    enabled: true
    clearance: 0.1
  schedule:
    enabled: true
    type: soft_to_hard
    soft_alpha_start: 1.0
    soft_alpha_end: 0.0
    hard_clearance_start: 0.5
    hard_clearance_end: 0.1
    schedule_type: linear
    reverse_mode: true
  cfs:
    enabled: true
    use_trajectory_qp: true
    max_iterations: 15
    use_late_stage_only: true
    late_stage_ratio: 0.2
    reconstruct_velocity: true
    smoothness_weight: 0.0
  action_constraint_type: motor_thrust

# Metadata
metadata:
  description: "Unified EDOC configuration for full 3D quadrotor with multiple backend support"
  author: "enerdynamics"
