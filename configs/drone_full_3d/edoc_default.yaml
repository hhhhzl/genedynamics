# EDOC experiment configuration for drone_full_3d environment
# Full quadrotor model with 12D state and 4D motor thrust control
name: drone_full_3d_edoc_default
output_dir: results/drone_full_3d/edoc

env_name: drone_full_3d
env_params:
  dt: 0.05
  horizon: 80
  p_max: 2.0
  v_max: 2.0
  control_limit: 1.0
  target: [0.0, 0.0, 1.0]
  vel_weight: 0.1
  orientation_weight: 0.1
  # DroneModel parameters
  mass: 0.5
  Ixx: 0.0023
  Iyy: 0.0023
  Izz: 0.0046
  arm_length: 0.17
  kf: 3.16e-10
  km: 7.94e-12
  gravity: 9.81

method: edoc
method_params:
  action_diffuse_steps: 100
  action_nsample: 512  # Increased for more complex dynamics
  use_antithetic: true
  action_score_mode: energy
  terminal_energy_weight: 50.0

obstacle_levels: [0, 1, 2, 3, 4, 5]  # Start with fewer levels for testing
obstacle_config:
  generator: box3d
  robot_radius: 0.1
  obstacle_radius_scale: 1.3
  p_max: 2.0
  obstacle_type: sphere  # "sphere" or "box"
  map_bounds:
    x_min: -1.5
    x_max: 1.5
    y_min: -1.5
    y_max: 1.5
    z_min: 0.0
    z_max: 2.0

seeds: [0, 1, 2]
backend: numpy  # Use numpy for now (DroneModel.step is not JAX-compatible)
device: cpu

metrics:
  - ssr
  - obstacle_density

visualizations:
  - trajectory_3d
  - diffusion_3d
  - energy_reward
  - states

constraint_config:
  soft_constraint:
    enabled: true
    alpha: 1.0
    beta: 10.0
  hard_constraint:
    enabled: true
    clearance: 0.1
  schedule:
    enabled: true
    type: soft_to_hard
    soft_alpha_start: 1.0
    soft_alpha_end: 0.0
    hard_clearance_start: 0.5
    hard_clearance_end: 0.1
    schedule_type: linear
    reverse_mode: true
  cfs:
    enabled: true
    use_trajectory_qp: true
    max_iterations: 15
    use_late_stage_only: true
    late_stage_ratio: 0.2
    reconstruct_velocity: true
    smoothness_weight: 0.0
  action_constraint_type: motor_thrust  # Motor thrusts instead of acceleration

metadata:
  description: "Default EDOC configuration for full 3D quadrotor environment with complete dynamics"
  author: "enerdynamics"

