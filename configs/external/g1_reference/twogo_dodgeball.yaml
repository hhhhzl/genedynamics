name: recoverymimic_g1_reference_twogo_dodgeball
output_dir: results/external/g1_reference/twogo_dodgeball

# RecoveryMimic owns causal G1 costs/constraints and the frozen WBC/world model.
# GD owns the complete 2GO sample/probe/geometry/gate/transport update.
env_name: external_trajectory_binding
env_params:
  dt: 0.02
  horizon: 10
  action_dim: 36
  control_limit: 1.0

method: 2go
method_params:
  Nsample: 32
  Ndiffuse: 5
  temp_sample: 0.3
  beta0: 1.0e-4
  betaT: 1.0e-2
  action_limit: 1.0
  action_extra_sigma: 0.0
  twogo_constraint_mode: trajectory_geometry_and_feasibility
  contraction_factors: [0.5, 0.25, 0.0]
  twogo_cvar_alpha: 0.9
  twogo_window_size: 6
  twogo_window_stride: 3
  twogo_active_topk: 8
  twogo_agp_eta: 0.08
  twogo_multi_scale: 0.25
  twogo_enable_local_gating: true
  twogo_gate_ema_beta: 0.7
  twogo_gate_risk_theta: 0.05
  twogo_task_dir_alpha: 0.15
  twogo_enable_geometry: true
  twogo_probe_enable: true
  twogo_probe_b: 8
  twogo_probe_tail_mix: 0.5
  twogo_probe_tail_pool_ratio: 0.25
  twogo_probe_geom_alpha: 0.25
  twogo_retract_qp_boost: true
  twogo_retract_qp_every: 2
  twogo_stability_eps: 1.0e-6
  twogo_gamma_init: 1.0
  twogo_transport_schedule: adaptive
  twogo_transport_ddim_frac: 0.3333333333333333
  twogo_transport_fm_frac: 0.6666666666666666
  twogo_overlay:
    hardness:
      rho_ref: 500.0
    constraint:
      kappa0: 1.0
      kappa_rho_gain: 0.01
      delta_margin_scale: 0.4
      delta_rho_gain: 0.02
      delta_min: 5.0e-4
    diffusion:
      sigma_max: 0.25
      sigma_hardness_power: 1.0
      theta_min: 0.2
      theta_max: 0.6
      eta_scale_min: 0.5
      eta_scale_max: 1.0
      eta_hardness_power: 1.0
      gate_every: 1
  replan_after_steps: 1
  clearance_margin: 0.05
  constraint_penalty: 100.0
  prior_weight: 0.01
  smoothness_weight: 0.01
  feasibility_tolerance: 1.0e-4
  # Exact worst case: candidates + 8 probe filters + geometry + mean filter,
  # over all five 2GO updates, followed by final evaluation.
  maximum_model_calls: 3460
  repair_trust_region:
    root_position_metres: 0.15
    root_rotation_radians: 0.35
    joint_position_radians: 0.25
    phase_rate: 0.25
  show_tqdm: false
  num_modes: 1

obstacle_levels: [0]
obstacle_config:
  generator: external_causal_belief

seeds: [0]
backend: torch
device: gpu
metrics: []
visualizations: []
auto_report: false

metadata:
  protocol: external_trajectory_binding_v1
  task_family: dodgeball
  control_space: reference_control
  lineage: task_adaptation
  formal_experiment: true
