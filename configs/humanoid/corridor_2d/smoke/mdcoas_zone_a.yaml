# ── MD-COAS Zone A only: thin center wall (multimodal: left or right) ──
name: humanoid_corridor_2d_mdcoas_zone_a
output_dir: results/humanoid/corridor_2d/smoke/mdcoas_zone_a

env_name: humanoid_corridor_2d
env_params:
  dt: 0.25
  horizon: 20
  scene_preset: zone_a
  vx_max: 0.8
  vx_min: -0.3
  vy_max: 0.3
  omega_max: 0.5
  h_dot_max: 0.3
  psi_torso_dot_max: 0.4
  arm_tuck_rate_max: 1.0
  arm_posture_rate_max: 1.0
  collision_margin: 0.03

method: cfsmbd_full
method_params:
  show_tqdm: true
  action_extra_sigma: 0.05
  max_constraints_per_point: 16
  constraint_margin: 0.01
  cfs_action_convexifier: cfs_action
  aug_lambda: 0.0
  aug_rho: 1.0
  num_modes: 8
  mode_strategy: multirun

obstacle_levels: [1]
obstacle_config:
  generator: corridor_2d
  robot_radius: 0.20
  collision_margin: 0.03
  success_margin: 0.20
  scene_preset: zone_a

seeds: [0]
backend: jax
device: cuda

metrics: [corridor_metrics]
visualizations: [corridor_trajectory, cost, adaptive, diffusion]

scheduler_config:
  type: composite
  constraint_schedulers:
    - type: alm_adaptive
      margin: 0.02
      lam0: 0.0
      rho0: 1.0
      nu0: 0.0
      compute_cost_mode: product
      compute_cost_a0: 0.0
      compute_cost_aK: 1.0
      compute_cost_aI: 1.0
      compute_cost_use_qp_gate: true
      compute_budget_B: 6.0
      compute_budget_time_profile: constant
      compute_budget_time_amp: 2.0
      compute_budget_time_mu: 0.5
      compute_budget_time_sigma: 0.2
      eta_nu: 0.05
      nu_max: 0.0
      eta_lam_forget: 0.02
      rho_min: 0.5
      rho_tau_hi: 5.0e-4
      rho_tau_lo: 1.0e-4
      rho_gamma_up: 2.0
      rho_gamma_down: 1.5
      rho_good_steps: 5
      gamma: 2.0
      rho_max: 500.0
      kappa: 0.9
      r_tol: 5e-4
      v_signal_mode: mean
      v_star: 0.06
      v_ema_beta: 0.3
      v_tau_hi: 0.08
      v_tau_lo: 0.03
      eta_p: 2.0
      eta_p_plus: 1.0
      eta_p_minus: 0.8
      eta_c_p: 0.2
      eta_topK: 10.0
      eta_topK_plus: 10.0
      eta_topK_minus: 2.0
      eta_c_topK: 1.0
      eta_I: 8.0
      eta_I_plus: 8.0
      eta_I_minus: 2.0
      eta_c_I: 1.0
      eta_eps: 0.01
      eta_eps_plus: 0.01
      eta_eps_minus: 0.003
      eta_c_eps: 0.01
      p_min: 0.0
      p_max: 1.0
      eps_min: 1e-5
      eps_max: 1e-2
      I_min: 1
      I_max: 10
      topK_min: 1
      topK_max: 10
      use_stochastic_gate: true
  diffusion_schedulers:
    - type: fixed
      M_k: 64
      T_k: 0.3
      Ndiffuse: 100
      beta0: 1e-5
      betaT: 1e-2
  constraint_merge_strategy: merge
  diffusion_merge_strategy: merge
