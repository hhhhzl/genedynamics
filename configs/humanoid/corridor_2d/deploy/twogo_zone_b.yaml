# Deploy parameters used to produce results/deploy/spark_rl/twogo_zone_b/spark_rl_final_03x.gif.
# Pair with configs/humanoid/corridor_2d/plan/twogo_zone_b.yaml.
#
# Note: zone_b is the only one whose plan keeps vx_max=0.8 / horizon=20
# (the slower vx=0.3 config did not get through the U-wall gap), but the
# deploy parameters below are the same as the other four zones.

plan: twogo_zone_b
plan_path: results/humanoid/corridor_2d/plan/twogo_zone_b/level_1/seed_0/trajectory/trajectory.json

control_hz: 50.0
sim_dt: 0.002

xy_kp: 1.5
xy_correction_cap: 0.25
yaw_kp: 0.0
warmup_sec: 0.8

cmd_lpf_tau: 0.0

spark_pd_gains: true

best_idx: null

render:
  cam_mode: global
  cam_azimuth: 90
  cam_elevation: -45
  every_n: 4
  width: 1200
  height: 600
  speed: 0.3
