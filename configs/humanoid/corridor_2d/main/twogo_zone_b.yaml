# ── 2GO Zone B, vx_max=0.3 (actuator-matched) — best tuned config ("G") ──
# Forward-speed cap lowered 0.8 -> 0.3 to match the SparkRL executor (+-0.3 m/s).
#
# The blocker at 0.3 is NOT horizon (zone_b needs only dx=2.0m; H=50 gives ~3.75m
# reach and goal_hardstop holds at goal). The real problem: at low vx the planner
# could not explore the DOWNWARD SIDESTEP needed to thread zone_b's bottom gap (the
# U-wall blocks the top 60%, y>=-0.16; the body center must dip to y~=-0.48, a narrow
# ~0.14m band, body = elliptical torso + arms). Three changes vs twogo_zone_b.yaml:
#   1) Lighter constraint enforcement (zone_a's set): max_constraints_per_point 8,
#      retract_qp_boost off, retract_qp_every 3, probe_b 32, scheduler p_min 0 /
#      I 1..10 / topK 1..10, Ndiffuse 100. zone_b's heavy per-step QP projection was
#      snapping exploring samples back -> 0/8 modes reached. Lightening it -> 8/8 reach.
#   2) More exploration so more modes COMMIT to the deep dip: action_extra_sigma
#      0.15->0.35, twogo_task_dir_alpha 0.3->0.1. (Pushing sigma to 0.5 helps at
#      omega 0.5 but HURTS once omega is lowered -- the noise needs omega to correct it.)
#   3) Modest safety margin so deep-dippers clear: constraint_margin 0.04, sched margin
#      0.05. Pushing margin higher (0.05-0.08) made it WORSE (back to 2/8); margin alone
#      never helps non-dipping modes -> exploration + heading are the real levers.
#   4) Heading alignment: omega_max 0.5->0.3 (BIGGEST single lever, 3/8->5/8). A low yaw
#      rate stops modes from twisting the body the WRONG way across the gap (psi>0 ->
#      wide y-profile -> clip). NOTE: this caps yaw rate -- check the SparkRL executor
#      allows 0.3 rad/s before deploy.
#
# Measured (seed 0): per-mode SSR = 5/8 = 0.625 (vs 0 at the naive 0.3 port, 3/8 before
# the omega fix); all 8 modes reach; selected (best_idx) trajectory safe + reaches with a
# healthy 0.083m clearance. Remaining 3 failures are NON-DIPPERS (go up into the wall,
# y>=0). horizon=50 matches twogo_zone_a. visualizations cleared for speed (re-add to plot).
name: humanoid_corridor_2d_twogo_zone_b_vx03
output_dir: results/humanoid/corridor_2d/main/twogo_zone_b_vx03

env_name: humanoid_corridor_2d
env_params:
  dt: 0.25
  horizon: 50
  scene_preset: zone_b
  vx_max: 0.3
  vx_min: -0.3
  vy_max: 0.3
  omega_max: 0.3
  h_dot_max: 0.3
  psi_torso_dot_max: 0.4
  arm_tuck_rate_max: 1.0
  arm_posture_rate_max: 1.0
  collision_margin: 0.03

method: 2go
method_params:
  show_tqdm: true
  twogo_transport_schedule: adaptive
  twogo_goal_hardstop: true
  action_extra_sigma: 0.35
  max_constraints_per_point: 8
  constraint_margin: 0.04
  cfs_action_convexifier: cfs_action
  aug_lambda: 0.0
  aug_rho: 1.0
  num_modes: 10
  mode_strategy: multirun

  twogo_gate_vrate_threshold: 0.01
  twogo_cvar_alpha: 0.9
  twogo_window_size: 6
  twogo_window_stride: 3
  twogo_tail_ratio: 0.3
  twogo_active_topk: 8
  twogo_agp_eta: 0.08
  twogo_cfs_gain: 0.35
  twogo_multi_scale: 0.25
  twogo_enable_agp_refine: false
  twogo_enable_local_gating: true
  twogo_gate_ema_beta: 0.7
  twogo_gate_risk_theta: 0.05
  twogo_task_dir_alpha: 0.1
  twogo_cluster_reweight_alpha: 0.0
  twogo_cluster_retract_mu: 0.0
  twogo_enable_sample_tail: true
  twogo_enable_agp_batch: false
  twogo_use_jax_scan_core: true
  twogo_retract_qp_boost: false
  twogo_enable_geometry: true
  twogo_stability_eps: 1e-6
  twogo_gamma_init: 1.0
  twogo_retract_qp_every: 3
  twogo_probe_enable: true
  twogo_probe_tail_mix: 0.5
  twogo_probe_tail_pool_ratio: 0.25
  twogo_probe_geom_alpha: 0.3
  twogo_probe_b: 32
  twogo_overlay:
    hardness:
      rho_ref: 500.0
    constraint:
      kappa0: 1.0
      kappa_rho_gain: 0.01
      delta_margin_scale: 0.4
      delta_rho_gain: 0.02
      delta_min: 5e-4
    diffusion:
      sigma_max: 0.15
      sigma_hardness_power: 1.0
      theta_max: 0.6
      theta_min: 0.2
      eta_scale_min: 0.5
      eta_scale_max: 1.0
      eta_hardness_power: 1.0
      gate_every: 1

obstacle_levels: [1]
obstacle_config:
  generator: corridor_2d
  robot_radius: 0.20
  collision_margin: 0.03
  success_margin: 0.20
  scene_preset: zone_b

seeds: [0, 1, 2, 3, 4]
backend: jax
device: cuda

metrics: [corridor_metrics]
visualizations: [corridor_trajectory, cost, adaptive, diffusion]

# Publication-style top-down planner figure (matplotlib_top backend).
visualization_config:
  corridor_trajectory:
    renderer: matplotlib_top
    body_shape: capsule
    arm_style: articulated
    ghost_color: time
    n_ghosts: 9
    highlight: narrowest
    axis_fontsize: 22
    tick_fontsize: 16
    show_title: false
    show_legend: false
    show_obstacle_labels: false

scheduler_config:
  type: composite
  constraint_schedulers:
    - type: alm_adaptive
      margin: 0.05
      lam0: 0.0
      rho0: 1.0
      nu0: 0.0
      compute_cost_mode: product
      compute_cost_a0: 0.0
      compute_cost_aK: 1.0
      compute_cost_aI: 1.0
      compute_cost_use_qp_gate: true
      compute_budget_B: 6.0
      compute_budget_time_profile: constant
      compute_budget_time_amp: 2.0
      compute_budget_time_mu: 0.5
      compute_budget_time_sigma: 0.2
      eta_nu: 0.05
      nu_max: 0.0
      eta_lam_forget: 0.02
      rho_min: 0.5
      rho_tau_hi: 5.0e-4
      rho_tau_lo: 1.0e-4
      rho_gamma_up: 2.0
      rho_gamma_down: 1.5
      rho_good_steps: 5
      gamma: 2.0
      rho_max: 500.0
      kappa: 0.9
      r_tol: 5e-4
      v_signal_mode: mean
      v_star: 0.06
      v_ema_beta: 0.3
      v_tau_hi: 0.08
      v_tau_lo: 0.03
      eta_p: 2.0
      eta_p_plus: 1.0
      eta_p_minus: 0.8
      eta_c_p: 0.2
      eta_topK: 10.0
      eta_topK_plus: 10.0
      eta_topK_minus: 2.0
      eta_c_topK: 1.0
      eta_I: 8.0
      eta_I_plus: 8.0
      eta_I_minus: 2.0
      eta_c_I: 1.0
      eta_eps: 0.01
      eta_eps_plus: 0.01
      eta_eps_minus: 0.003
      eta_c_eps: 0.01
      p_min: 0.0
      p_max: 1.0
      eps_min: 1e-5
      eps_max: 1e-2
      I_min: 1
      I_max: 10
      topK_min: 1
      topK_max: 10
      use_stochastic_gate: true
  diffusion_schedulers:
    - type: fixed
      M_k: 1024
      T_k: 0.3
      Ndiffuse: 100
      beta0: 1e-5
      betaT: 1e-2
  constraint_merge_strategy: merge
  diffusion_merge_strategy: merge
