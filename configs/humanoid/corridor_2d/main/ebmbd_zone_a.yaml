# ── EB-MBD Zone A: thin center wall — emerging-barrier constraint scheduler ──
name: humanoid_corridor_2d_ebmbd_zone_a
output_dir: results/humanoid/corridor_2d/main/ebmbd_zone_a

env_name: humanoid_corridor_2d
env_params:
  dt: 0.25
  horizon: 50
  scene_preset: zone_a
  vx_max: 0.3
  vx_min: -0.3
  vy_max: 0.3
  omega_max: 0.5
  h_dot_max: 0.3
  psi_torso_dot_max: 0.4
  arm_tuck_rate_max: 1.0
  arm_posture_rate_max: 1.0
  collision_margin: 0.03

method: ebmbd
method_params:
  show_tqdm: true
  action_extra_sigma: 0.10
  terminal_energy_weight: 160.0
  use_min_over_time: true
  num_modes: 8
  mode_strategy: multirun

obstacle_levels: [1]
obstacle_config:
  generator: corridor_2d
  robot_radius: 0.20
  collision_margin: 0.03
  success_margin: 0.20
  scene_preset: zone_a

seeds: [0]
backend: jax
device: cpu

metrics: [corridor_metrics]
visualizations: [corridor_trajectory, cost, diffusion]

scheduler_config:
  type: composite
  diffusion_schedulers:
    - type: fixed
      M_k: 1024
      T_k: 0.3
      Ndiffuse: 100
      beta0: 1e-5
      betaT: 1e-2
  diffusion_merge_strategy: merge
  constraint_schedulers:
    - type: emerging_barrier
      mu: 2.0
      alpha: 2.0
      bound: 0.20
      use_min_over_time: true
      terminal_energy_weight: 80.0
      margin: 0.01
  constraint_merge_strategy: merge
