# Humanoid MBD experiment (ant humanoid or G1, MJX)
# Run: python -m genedynamics.experiments.runner configs/humanoid/mbd_experiment.yaml
# For G1: set env_name to humanoid_g1_mjx and ensure MUJOCO_MENAGERIE_PATH

name: humanoid_mbd_experiment
output_dir: results/humanoid/mbd

env_name: humanoid_simplified_mjx
env_params:
  dt: 0.05
  horizon: 64
  target: [3.0, 0.0, 1.0]
  control_limit: 0.4
  physics_backend: mjx

method: mbd
method_params:
  Nsample: 1024
  Ndiffuse: 100
  temp_sample: 0.1
  terminal_energy_weight: 100.0
  show_tqdm: true

obstacle_levels: [0, 1, 2, 3, 4, 5]
obstacle_config:
  generator: box3d
  robot_radius: 0.15
  obstacle_radius_scale: 1.3
  p_max: 2.0
  obstacle_type: sphere
  map_bounds:
    x_min: -1.5
    x_max: 3.5
    y_min: -1.5
    y_max: 1.5
    z_min: 0.0
    z_max: 2.0

seeds: [0]
backend: jax
device: cpu

metrics:
  - ssr
  - obstacle_density

visualizations:
  - trajectory_3d
  - diffusion_3d
