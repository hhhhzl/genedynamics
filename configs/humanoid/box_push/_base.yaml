task: humanoid_box_push
seeds: [0, 1]
n_steps: 100

# Shared physical execution layer.  Fixed-stance levels use the load-aware
# ankle/hip closure; push_walk ignores those stance-only terms.
env_params:
  hand_contact_solref: [0.05, 1.0]
  wall_contact_solref: [0.10, 1.0]
  stance_force_ankle_gain: -1.5
  stance_com_ankle_gain: 250.0
  stance_com_ankle_damping: 20.0
  stance_force_hip_gain: 0.007
  stance_force_hip_deadband: 15.0

# One frozen CPU protocol for every algorithm.  P1--P4 are evaluation suites,
# not solver variants; method YAMLs differ only by the algorithm.
method_params:
  Hsample: 16
  Hnode: 4
  Nsample: 64
  Ndiffuse_init: 10
  Ndiffuse: 2
  temp_sample: 0.06
  action_limit: 1.0
  dt: 0.02
  ctrl_dt: 0.02
  seed: 0
  aug_lambda: 2.0
  aug_rho: 200.0

evaluation:
  seeds: [0, 1]
  n_steps: 100
  environments:
    - name: p1_force_15n
      level: push_to_line
      env_params:
        f_target: 15.0
        fixed_force_target: true
        fixed_contact_target: true
        box_frictionloss: 10000.0
        push_dist: 0.5
        w_box: 0.0
        w_prog: 0.0
        w_force: 10.0
    - name: p1_force_30n
      level: push_to_line
      env_params:
        f_target: 30.0
        fixed_force_target: true
        fixed_contact_target: true
        box_frictionloss: 10000.0
        push_dist: 0.5
        w_box: 0.0
        w_prog: 0.0
        w_force: 10.0
    - name: p2_push_nominal
      level: push_to_line
      env_params:
        push_dist: 0.10
        goal_eps: 0.005
    - name: p2_push_ood
      level: heavy_dr
      env_params:
        f_target: 45.0
        push_dist: 0.10
        goal_eps: 0.005
    - name: p3_unjam
      level: unjam
      env_params:
        f_target: 45.0
        push_dist: 0.03
        goal_eps: 0.005
        unjam_yaw_eps: 0.03
        yaw_frictionloss: 2.0
        contact_band: 0.02
    - name: p4_walk_push
      level: push_walk
      env_params:
        push_dist: 0.30
        s_scale: 0.25
        w_stiffness_nominal: 2.0
        box_frictionloss: 8.0
        w_gait: 30.0
        w_vel: 1.0
        target_vx: 0.25
        approach_time: 0.30
        force_ramp_time: 0.30
        gait_ramp_time: 0.5
        gait_cadence: 0.8
        gait_hip_amp: 0.15
        gait_knee_amp: 0.30
        gait_capture_gain: 0.25
        gait_roll_amp: 0.15
        gait_roll_capture_gain: 1.5

metrics: [humanoid_box_push]
backend: jax
