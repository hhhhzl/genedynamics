# Phase 4: SHAC-only baseline on flat-ground crawling (writeup §13.1 #9 / Q3).
#
# Optimizes the controller phi (80 dims) via Short-Horizon Actor-Critic on a
# fixed all-ones morphology — directly comparable to MRMFMBD's phi-only ablation
# at matched compute.
#
# Reference: Xu et al., ICLR 2022. Source code at NVlabs/DiffRL — consulted
# for algorithm details (truncated h, terminal critic, td-λ, target Polyak).
#
# Implementation notes
# --------------------
# * Differentiable rollouts: we backprop through scene.rollout_h_from_state.
#   See genedynamics/envs/external/jax_mpm/scene.py for the safe-divide patch
#   that makes the friction kernel produce finite gradients at v=0.
# * Stochastic policy: phi_i ~ N(phi_mean, explore_sigma^2 I). Setting
#   explore_sigma to 0 collapses to BPTT (paper §3.2 — known to fall into
#   local minima on contact-rich tasks; we keep sigma>0 by default).
# * Critic: 64-64 tanh MLP on a 9-dim observation (COM pos/vel + mean speed
#   + sin/cos time encoding). Defined in scene.observation_from_carry.
name: shac_crawling_ground
output_dir: results/soft_robot/main_v2/shac_only_crawling
cache_dir: results/soft_robot/main_v2/shac_only_crawling_cache

baseline_name: shac
task_domain: jax_mpm
task_id: crawling_ground
seeds: [0, 1, 2, 3, 4]
save_gif: true

evaluator_runtime:
  max_workers: 1
  reward_shaping_weight: 100.0
  n_grid: 64
  voxel_dims: [4, 3, 4]
  act_strength_base: 24.0
  scale: 50.0

method_params:
  backend: jax

  # === SHAC core (paper Tables 1, 4) =========================================
  h: 32                      # truncated rollout window
  n_envs: 32                 # parallel trajectories per episode
  n_episodes: 500            # outer learning episodes
  discount: 0.99
  td_lambda: 0.95            # td-λ value-target coefficient
  env_horizon: 200           # frames per full eval rollout
  reset_every: 1             # hard-reset to _init_carry every N episodes

  # === Stochastic policy =====================================================
  explore_sigma: 0.1         # 0.0 → degenerates to plain BPTT
  deterministic: false
  phi_lo: -0.5
  phi_hi: 0.5

  # === Critic ================================================================
  critic_hidden: [64, 64]    # MLP hidden sizes (input is _OBS_DIM=9)
  target_alpha: 0.995        # Polyak averaging
  n_critic_iters: 16
  n_critic_minibatches: 4

  # === Optimizers ============================================================
  actor_lr: 2.0e-3
  critic_lr: 5.0e-4
  actor_grad_clip: 1.0       # global L2 norm clip — stability
  critic_grad_clip: 1.0

  # === Soft-robot integration ================================================
  n_actuators: 10
  friction: 0.5              # ignored if a regime bank is set on the evaluator
  show_tqdm: true
  log_every: 25

  # === Compatibility with the experiment framework's CMA-ES knobs ============
  # The framework's task_domain provider derives x_dim from voxel_dims and
  # phi_dim from MPMConfig (n_actuators × n_sin_waves + 4×n_actuators = 80).
  # SHACBaseline ignores x_dim and morphology unless `morphology:` is set
  # (Q3 fixed-body experiment).
