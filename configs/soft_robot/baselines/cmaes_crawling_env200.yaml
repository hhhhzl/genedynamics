# CMA-ES with fine-fidelity (200 env-steps) — same budget structure as main's
# fine-fidelity block. Paired with cmaes_crawling.yaml (env=100) so we can
# see whether giving CMA-ES double the per-rollout time (and half the total
# rollouts at same wall-time) helps it climb higher.
name: cmaes_crawling_ground_env200
output_dir: results/soft_robot/baselines/cmaes_crawling_env200
cache_dir: results/soft_robot/baselines/cmaes_crawling_env200_cache

baseline_name: cmaes
task_domain: jax_mpm
task_id: crawling_ground
seeds: [0]
save_gif: true

evaluator_runtime:
  max_workers: 1
  reward_shaping_weight: 100.0
  n_grid: 64
  voxel_dims: [4, 3, 4]
  act_strength_base: 24.0
  scale: 50.0
  mode_friction: [0.45]           # single-mode = mean; cmaes has no mode marginalization

scheduler_config:
  type: composite
  diffusion_schedulers:
    - type: fixed
      M_k: 32
      T_k: 0.5
      Ndiffuse: 100
      beta0: 1.0e-4
      betaT: 2.0e-2
  diffusion_merge_strategy: merge

method_params:
  num_modes: 1
  popsize: 32
  sigma0: 0.3
  show_tqdm: true
  fine_fidelity_level: 2          # <-- env=200 (vs cmaes_crawling.yaml's env=100)
  x_lo: 0.2
  x_hi: 1.0
  x_mean: 0.6
  phi_lo: -0.5
  phi_hi: 0.5
  phi_mean: 0.0
