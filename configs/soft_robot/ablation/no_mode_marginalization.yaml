# Ablation: disable S1 mode marginalization (num_modes=1, single friction).
# Friction = 0.45 (mean of the 4-mode main [0.3, 0.4, 0.5, 0.6]) so the
# single-mode is the "average contact" rather than the default first mode (0.3).
# Everything else identical to main/crawling_ground.yaml.
name: ablation_no_mode_marginalization
output_dir: results/soft_robot/ablation/no_mode_marginalization
cache_dir: results/soft_robot/ablation/no_mode_marginalization_cache

baseline_name: mrmfmbd
task_domain: jax_mpm
task_id: crawling_ground
seeds: [0]
save_gif: true

evaluator_runtime:
  max_workers: 1
  reward_shaping_weight: 100.0
  n_grid: 64
  voxel_dims: [4, 3, 4]
  act_strength_base: 24.0
  scale: 50.0
  mode_friction: [0.45]           # single-mode = mean of main's [0.3,0.4,0.5,0.6]

scheduler_config:
  type: composite
  diffusion_schedulers:
    - type: fixed
      M_k: 32
      T_k: 0.5
      Ndiffuse: 100
      beta0: 1.0e-4
      betaT: 2.0e-2
  diffusion_merge_strategy: merge

method_params:
  backend: mbd
  num_modes: 1                    # <-- ablation: no S1
  num_fidelity_levels: 3
  fidelity_ladder_type: geometric
  fidelity_step_ratio: 1.5
  fine_fidelity_level: 2
  reward_temperature_min: 0.05
  tau_frac: 0.05
  top_k_fine: 5
  show_tqdm: true
  morphology_symmetry: z
  phi_dim_override: true
  phi_lo: -0.5
  phi_hi: 0.5
  phi_std: 0.15
  x_lo: 0.2
  x_hi: 1.0
  x_mean: 0.6
  x_std: 0.3
