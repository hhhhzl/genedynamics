# CEM (Cross-Entropy Method) baseline for crawling_ground.
# Same task/physics as main/crawling_ground.yaml for fair comparison.
# Budget = Ndiffuse × M_k × num_modes  (matches MRMFMBD main).
name: cem_crawling_ground
output_dir: results/soft_robot/co_design/baselines/cem_crawling
cache_dir: results/soft_robot/co_design/baselines/cem_crawling_cache

baseline_name: cem
task_domain: jax_mpm
task_id: crawling_ground
seeds: [0]
save_gif: true

evaluator_runtime:
  max_workers: 1
  reward_shaping_weight: 100.0
  n_grid: 64
  voxel_dims: [4, 3, 4]
  act_strength_base: 24.0
  scale: 50.0
  mode_friction: [0.45]           # single-mode = mean; cem has no mode marginalization

method_params:
  num_modes: 1                # no mode marginalization
  popsize: 32                 # K·M·num_modes/(popsize·num_modes) = 100 generations
  elite_frac: 0.25
  init_std: 0.3
  min_std: 0.02
  noise_decay: 0.97
  extra_noise: 0.05
  show_tqdm: true
  fine_fidelity_level: 1      # 100 env-steps (no fidelity ladder — single fidelity)
  # Search bounds must match jax_mpm's controller clipping.
  x_lo: 0.2
  x_hi: 1.0
  x_mean: 0.6
  phi_lo: -0.5
  phi_hi: 0.5
  phi_mean: 0.0
