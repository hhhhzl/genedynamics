# P2 Table-1 baseline: CMA-ES on the FAIR axis vs MR-MF-MBD.
# Identical setup to cem_crawling_p2.yaml (SAME 32-d A2 latent morphology space,
# SAME risk-sensitive multi-regime objective via risk_codesign, sinusoid controller,
# SAME rho_H certification) — only the OPTIMIZER differs (CMA-ES vs CEM vs our MBD).
# This isolates "is our diffusion search a better co-design optimizer than evolution
# strategies?" under a leveled objective; contribution (3)=risk is shown by ablation,
# not here. Budget = num_samples * num_iterations design-evals (x num_modes rollouts).
# n_grid=64 workhorse; CPU-runnable (forward-only) via JAX_PLATFORMS=cpu.
name: cmaes_crawling_p2
output_dir: results/soft_robot/co_design/baselines/cmaes_crawling_p2
cache_dir: results/soft_robot/co_design/baselines/cmaes_crawling_p2_cache

baseline_name: cmaes
task_domain: jax_mpm
task_id: crawling_ground
seeds: [0, 1, 2]
save_gif: false

evaluator_runtime:
  max_workers: 1
  reward_shaping_weight: 100.0
  n_grid: 64
  voxel_dims: [13, 8, 13]
  act_strength_base: 24.0
  scale: 50.0
  mode_friction: [0.3, 0.4, 0.5, 0.6]   # the 4 regimes; risk_codesign reads these

method_params:
  # --- same morphology space as ours (A2 latent decoder) ---
  morph_latent_dim: 32
  morph_decoder_path: data/morph_decoders/loco_big_l32
  voxel_dims: [13, 8, 13]
  morph_latent_lo: -2.0
  morph_latent_hi: 2.0
  morph_latent_mean: 0.0
  # --- same robust objective as ours ---
  risk_codesign: true
  num_modes: 4
  risk_temperature: 1.0
  num_env_steps: 200          # fine fidelity (matches ours' certification)
  # --- CMA-ES budget (matched to cem_crawling_p2; same design-eval count) ---
  num_samples: 24
  num_iterations: 20
  elite_frac: 0.5             # CMA-ES default (mu = popsize/2)
  init_std: 0.8
  min_std: 0.1
  show_tqdm: true
  # --- sinusoid controller bounds (shared baseline controller) ---
  phi_lo: -0.5
  phi_hi: 0.5
  phi_mean: 0.0
