# 6-regime WIDE-FRICTION conflict sweep — CEM-rho (risk-sensitive).
# Wide friction [0.05 ice .. 1.3 very sticky] so the regimes genuinely CONFLICT
# (a slip-optimal gait != a grip-optimal gait), unlike the narrow [0.3-0.6] band.
# Certified by risk-sensitive rho_H over the 6 regimes. Pairs with cem_mean_*
# (regime_agg=mean) to show ours-risk's worst-case advantage on the radar.
name: cem_mean_crawling_6reg
output_dir: results/soft_robot/co_design/baselines/cem_mean_crawling_6reg
cache_dir: results/soft_robot/co_design/baselines/cem_mean_crawling_6reg_cache

baseline_name: cem
task_domain: jax_mpm
task_id: crawling_ground
seeds: [0]
save_gif: false

evaluator_runtime:
  max_workers: 1
  reward_shaping_weight: 100.0
  n_grid: 64
  voxel_dims: [13, 8, 13]
  act_strength_base: 24.0
  scale: 50.0
  mode_friction: [0.05, 0.2, 0.4, 0.7, 1.0, 1.3]   # 6 conflicting regimes

method_params:
  morph_latent_dim: 32
  morph_decoder_path: data/morph_decoders/loco_big_l32
  voxel_dims: [13, 8, 13]
  morph_latent_lo: -2.0
  morph_latent_hi: 2.0
  morph_latent_mean: 0.0
  risk_codesign: true
  regime_agg: mean           # risk-NEUTRAL mean over regimes (the spiky-radar contrast)
  num_modes: 6
  risk_temperature: 1.0
  num_env_steps: 200
  num_samples: 24
  num_iterations: 20
  elite_frac: 0.25
  init_std: 0.8
  min_std: 0.1
  noise_decay: 0.97
  extra_noise: 0.05
  show_tqdm: true
  phi_lo: -0.5
  phi_hi: 0.5
  phi_mean: 0.0
