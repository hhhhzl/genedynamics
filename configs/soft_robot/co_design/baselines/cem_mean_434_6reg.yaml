# [4,3,4] raw-voxel VERIFICATION (aligned with prior cem_crawling.yaml scale).
# 6-regime wide-friction conflict + outer=100 / inner=32 (matched to ours K=100/M_k=32).
# CEM-rho (risk-sensitive). No decoder -> optimizes the 48-d occupancy directly.
name: cem_mean_434_6reg
output_dir: results/soft_robot/co_design/verify_434/cem_mean
cache_dir: results/soft_robot/co_design/verify_434/cem_mean_cache

baseline_name: cem
task_domain: jax_mpm
task_id: crawling_ground
seeds: [0]
save_gif: false

evaluator_runtime:
  max_workers: 1
  reward_shaping_weight: 100.0
  n_grid: 64
  voxel_dims: [4, 3, 4]
  act_strength_base: 24.0
  scale: 50.0
  mode_friction: [0.05, 0.2, 0.4, 0.7, 1.0, 1.3]

method_params:
  voxel_dims: [4, 3, 4]
  x_lo: 0.2
  x_hi: 1.0
  x_mean: 0.6
  risk_codesign: true
  regime_agg: mean
  num_modes: 6
  risk_temperature: 1.0
  num_env_steps: 200
  num_samples: 32
  num_iterations: 100
  elite_frac: 0.25
  init_std: 0.8
  min_std: 0.1
  noise_decay: 0.97
  extra_noise: 0.05
  show_tqdm: true
  phi_lo: -0.5
  phi_hi: 0.5
  phi_mean: 0.0
