# P2 Table-1 baseline: CEM on the FAIR axis vs MR-MF-MBD.
#   * SAME morphology space : A2 shape latent w (loco_big_l32 decoder, 32-d,
#     [13,8,13]) — CEM searches the IDENTICAL latent our method does, not raw voxels.
#   * SAME robust objective  : risk_codesign=true -> the env energy is the
#     risk-sensitive rho over the 4 regimes (not single-mode), so CEM optimizes the
#     SAME objective we certify by (no "ours-risk vs CEM-nominal" unfairness).
#   * Controller             : sinusoid (80-d) — the controller axis shared by all
#     gradient-free baselines; the LEARNED controller is OUR extra axis (ablation).
#   * Certification          : the returned (w, phi) is re-rolled over the 4 modes
#     at fine fidelity (200 steps) and scored by the SAME rho_H.
# Budget = num_samples * num_iterations design-evals (x num_modes mode-rollouts).
# n_grid=64 is the campaign WORKHORSE; bump to 128 + matching budget for the headline.
# CPU-runnable (forward-only): JAX_PLATFORMS=cpu to run alongside GPU policy training.
name: cem_crawling_p2
output_dir: results/soft_robot/co_design/baselines/cem_crawling_p2
cache_dir: results/soft_robot/co_design/baselines/cem_crawling_p2_cache

baseline_name: cem
task_domain: jax_mpm
task_id: crawling_ground
seeds: [0, 1, 2]
save_gif: false

evaluator_runtime:
  max_workers: 1
  reward_shaping_weight: 100.0
  n_grid: 64
  voxel_dims: [13, 8, 13]
  act_strength_base: 24.0
  scale: 50.0
  mode_friction: [0.3, 0.4, 0.5, 0.6]   # the 4 regimes; risk_codesign reads these

method_params:
  # --- same morphology space as ours (A2 latent decoder) ---
  morph_latent_dim: 32
  morph_decoder_path: data/morph_decoders/loco_big_l32
  voxel_dims: [13, 8, 13]
  morph_latent_lo: -2.0
  morph_latent_hi: 2.0
  morph_latent_mean: 0.0
  # --- same robust objective as ours ---
  risk_codesign: true
  num_modes: 4
  risk_temperature: 1.0
  num_env_steps: 200          # fine fidelity (matches ours' certification)
  # --- CEM budget (matched-ish to ours' candidate count; tune per fairness study) ---
  num_samples: 24
  num_iterations: 20
  elite_frac: 0.25
  init_std: 0.8
  min_std: 0.1
  noise_decay: 0.97
  extra_noise: 0.05
  show_tqdm: true
  # --- sinusoid controller bounds (shared baseline controller) ---
  phi_lo: -0.5
  phi_hi: 0.5
  phi_mean: 0.0
