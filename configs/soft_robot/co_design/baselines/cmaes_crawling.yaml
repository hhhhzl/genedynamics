# CMA-ES baseline for crawling_ground.
# Same task/physics as main/crawling_ground.yaml for fair comparison.
name: cmaes_crawling_ground
output_dir: results/soft_robot/co_design/baselines/cmaes_crawling
cache_dir: results/soft_robot/co_design/baselines/cmaes_crawling_cache

baseline_name: cmaes
task_domain: jax_mpm
task_id: crawling_ground
seeds: [0]
save_gif: true

evaluator_runtime:
  max_workers: 1
  reward_shaping_weight: 100.0
  n_grid: 64
  voxel_dims: [4, 3, 4]
  act_strength_base: 24.0
  scale: 50.0
  mode_friction: [0.45]           # single-mode = mean; cmaes has no mode marginalization

scheduler_config:
  # CMA-ES doesn't use the diffusion schedule directly, but the baseline
  # reads Ndiffuse × M_k × num_modes as the total rollout budget for fair
  # comparison against MRMFMBD main (100 × 32 × 4 = 12800 rollouts).
  type: composite
  diffusion_schedulers:
    - type: fixed
      M_k: 32
      T_k: 0.5
      Ndiffuse: 100
      beta0: 1.0e-4
      betaT: 2.0e-2
  diffusion_merge_strategy: merge

method_params:
  num_modes: 1                # no mode marginalization
  popsize: 32                 # K·M·num_modes/(popsize·num_modes) = 100 generations
  sigma0: 0.3
  show_tqdm: true
  fine_fidelity_level: 1      # 100 env-steps (no fidelity ladder — single fidelity)
  # Search bounds — must match jax_mpm's clipping (scene.py uses phi ∈ [-0.5, 0.5]
  # and morphology ∈ [0.2, 1.0]). The cmaes baseline's legacy defaults
  # (phi ∈ [5, 150]) would saturate every tanh and flatten the fitness surface.
  x_lo: 0.2
  x_hi: 1.0
  x_mean: 0.6
  phi_lo: -0.5
  phi_hi: 0.5
  phi_mean: 0.0
