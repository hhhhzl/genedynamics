# Phase 2 / Stage 7: carry / transport task (loco-manipulation).
#
# Mirrors push.yaml but flips ManipulandConfig.horizontal_only=False so the
# object falls under gravity and must be SUPPORTED + transported by the body
# (needs a cavity / tray morphology). Reward = forward transport + closing +
# contact-stability G_T − drop penalty (scene.rollout_return_carry).
#
# regime_bank: train_carry → 4 terrains (incl. slopes) × 3 frictions × 3 masses
# = 36 modes. Risk-sensitive marginalization drives heavy-mass / steep-slope
# (the drop-prone) regimes.
name: mrmfmbd_carry
output_dir: results/soft_robot/co_design/main_v2/carry
cache_dir: results/soft_robot/co_design/main_v2/carry_cache

baseline_name: mrmfmbd
task_domain: jax_mpm
task_id: carry
seeds: [0, 1, 2, 3, 4]
save_gif: true

evaluator_runtime:
  max_workers: 1
  reward_shaping_weight: 100.0
  n_grid: 64
  voxel_dims: [4, 3, 4]
  act_strength_base: 24.0
  scale: 50.0
  task: carry
  regime_bank_kind: train_carry
  push_goal_x: 0.85

scheduler_config:
  type: composite
  diffusion_schedulers:
    - type: fixed
      M_k: 32
      T_k: 0.5
      Ndiffuse: 100
      beta0: 1.0e-4
      betaT: 2.0e-2
  diffusion_merge_strategy: merge

method_params:
  backend: mbd
  num_fidelity_levels: 3
  fidelity_ladder_type: geometric
  fidelity_step_ratio: 1.5
  fine_fidelity_level: 2
  reward_temperature_min: 0.05
  tau_frac: 0.05
  top_k_fine: 5
  show_tqdm: true
  morphology_symmetry: z
  phi_dim_override: true
  phi_lo: -0.5
  phi_hi: 0.5
  phi_std: 0.15
  x_lo: 0.2
  x_hi: 1.0
  x_mean: 0.6
  x_std: 0.3

  regime_posterior_mode: risk_sensitive
  risk_temperature: 1.0
