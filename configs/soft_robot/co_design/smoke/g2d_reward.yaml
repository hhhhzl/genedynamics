name: mrmfmbd_g2d_reward
output_dir: results/soft_robot/co_design/smoke/g2d_reward
cache_dir: results/soft_robot/co_design/smoke/g2d_reward_cache
baseline_name: mrmfmbd
task_domain: jax_mpm
task_id: crawling_ground
seeds: [0]
save_gif: false
evaluator_runtime: {max_workers: 1, reward_shaping_weight: 100.0, n_grid: 64, voxel_dims: [4,3,4], act_strength_base: 24.0, scale: 50.0}
scheduler_config:
  type: composite
  diffusion_schedulers: [{type: fixed, M_k: 8, T_k: 0.5, Ndiffuse: 12, beta0: 1.0e-4, betaT: 2.0e-2}]
  diffusion_merge_strategy: merge
method_params:
  backend: mbd
  num_modes: 4
  num_fidelity_levels: 1
  fine_fidelity_level: 2
  reward_temperature_min: 0.05
  tau_frac: 0.05
  top_k_fine: 3
  show_tqdm: false
  morphology_symmetry: z
  phi_dim_override: true
  phi_lo: -0.5
  phi_hi: 0.5
  phi_std: 0.15
  x_lo: 0.2
  x_hi: 1.0
  x_mean: 0.6
  x_std: 0.3
  regime_posterior_mode: reward
