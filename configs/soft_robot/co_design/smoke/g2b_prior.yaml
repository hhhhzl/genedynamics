# G2a smoke — A2 shape-latent decoder wired before rollout.
# Tiny (K5, M4, C1) + morph_latent_dim=8 + data/morph_decoders/loco_cpu.
# Voxel grid 3,3,3 (=27) matches the decoder's occupancy output; no z-symmetry.
# Smoke criteria: x-block dim == 8, decoded occupancy ∈ [x_lo,x_hi], reward finite.
name: mrmfmbd_g2b_smoke
output_dir: results/soft_robot/co_design/smoke/g2b
cache_dir: results/soft_robot/co_design/smoke/g2b_cache

baseline_name: mrmfmbd
task_domain: jax_mpm
task_id: crawling_ground
seeds: [0]
save_gif: false

evaluator_runtime:
  max_workers: 1
  reward_shaping_weight: 100.0
  n_grid: 64
  voxel_dims: [3, 3, 3]
  act_strength_base: 24.0
  scale: 50.0

scheduler_config:
  type: composite
  diffusion_schedulers:
    - type: fixed
      M_k: 4
      T_k: 0.5
      Ndiffuse: 5
      beta0: 1.0e-4
      betaT: 2.0e-2
  diffusion_merge_strategy: merge

method_params:
  backend: mbd
  num_modes: 1
  num_fidelity_levels: 1
  fine_fidelity_level: 0
  reward_temperature_min: 0.05
  tau_frac: 0.05
  top_k_fine: 2
  show_tqdm: true
  phi_dim_override: true
  phi_lo: -0.5
  phi_hi: 0.5
  phi_std: 0.15
  # A2 decoder (G2a): x-block becomes an 8-D shape latent w ~ N(0,I).
  morph_latent_dim: 8
  morph_decoder_path: data/morph_decoders/loco_cpu
  morph_latent_lo: -2.0
  morph_latent_hi: 2.0
  x_lo: 0.2
  x_hi: 1.0
  use_prior_weight: true
  prior_weight: 1.0
