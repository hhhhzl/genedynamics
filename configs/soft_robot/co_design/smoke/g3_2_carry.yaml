name: mrmfmbd_carry_smoke
output_dir: results/soft_robot/co_design/smoke/g3_2_carry
cache_dir: results/soft_robot/co_design/smoke/g3_2_carry_cache
baseline_name: mrmfmbd
task_domain: jax_mpm
task_id: carry
seeds: [0]
save_gif: false
evaluator_runtime:
  max_workers: 1
  reward_shaping_weight: 100.0
  n_grid: 64
  voxel_dims: [4,3,4]
  act_strength_base: 24.0
  scale: 50.0
  task: carry
  regime_bank_kind: train_carry
  push_goal_x: 0.85
scheduler_config:
  type: composite
  diffusion_schedulers: [{type: fixed, M_k: 4, T_k: 0.5, Ndiffuse: 3, beta0: 1.0e-4, betaT: 2.0e-2}]
  diffusion_merge_strategy: merge
method_params:
  backend: mbd
  num_modes: 2
  num_fidelity_levels: 1
  fine_fidelity_level: 0
  reward_temperature_min: 0.05
  tau_frac: 0.05
  top_k_fine: 2
  show_tqdm: true
  morphology_symmetry: z
  phi_dim_override: true
  phi_lo: -0.5
  phi_hi: 0.5
  phi_std: 0.15
  x_lo: 0.2
  x_hi: 1.0
  x_mean: 0.6
  x_std: 0.3
  regime_posterior_mode: risk_sensitive
