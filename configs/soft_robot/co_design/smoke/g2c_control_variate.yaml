# G2c smoke — multi-fidelity control-variate score estimator.
# Each denoising step: ALL M=8 proposals at low fidelity (fid0, 30 env-steps)
# + top-2 subset at high fidelity (fid2, 200 env-steps), combined by the
# control-variate corrected reward. num_fidelity_levels=1 → single (fine) block;
# the low fidelity is fixed by cv_low_fidelity_level. Smoke: runs, finite reward,
# two fidelities per step (verified separately by the variance script).
name: mrmfmbd_g2c_smoke
output_dir: results/soft_robot/co_design/smoke/g2c
cache_dir: results/soft_robot/co_design/smoke/g2c_cache

baseline_name: mrmfmbd
task_domain: jax_mpm
task_id: crawling_ground
seeds: [0]
save_gif: false

evaluator_runtime:
  max_workers: 1
  reward_shaping_weight: 100.0
  n_grid: 64
  voxel_dims: [4, 3, 4]
  act_strength_base: 24.0
  scale: 50.0

scheduler_config:
  type: composite
  diffusion_schedulers:
    - type: fixed
      M_k: 8
      T_k: 0.5
      Ndiffuse: 5
      beta0: 1.0e-4
      betaT: 2.0e-2
  diffusion_merge_strategy: merge

method_params:
  backend: mbd
  num_modes: 4
  num_fidelity_levels: 1
  fine_fidelity_level: 2          # high fidelity = 200 env-steps
  reward_temperature_min: 0.05
  tau_frac: 0.05
  top_k_fine: 2
  show_tqdm: true
  morphology_symmetry: z
  phi_dim_override: true
  phi_lo: -0.5
  phi_hi: 0.5
  phi_std: 0.15
  x_lo: 0.2
  x_hi: 1.0
  x_mean: 0.6
  x_std: 0.3
  # G2c control-variate: physics-resolution (substep) low fidelity — coarse dt
  # at the SAME 200 env-steps (reward-correlated + cheaper). High = fine dt 5e-4.
  method: control_variate
  cv_low_dt: 1.0e-3               # 8 substeps/step vs fine 16 (2x cheaper)
  cv_subset_k: 2
  nu_max: 0.0
