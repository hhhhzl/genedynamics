# [4,3,4] raw-voxel VERIFICATION config for OURS (M3BD), aligned with prior scale.
# Raw 48-d occupancy (NO decoder). Controller type set via --override (sinusoid / learned).
# Outer K=100 / inner M_k=32 set via --override to match CEM/CMAES (outer=100, inner=32).
name: mrmfmbd_crawling_434
output_dir: results/soft_robot/co_design/verify_434/ours
task_domain: jax_mpm
task_id: crawling_ground

method_params:
  backend: mbd
  num_modes: 6
  regime_posterior_mode: risk_sensitive
  risk_temperature: 1.0
  reward_temperature_min: 0.05
  tau_frac: 0.1
  top_k_fine: 5
  fine_fidelity_level: 2
  # raw-voxel occupancy morphology (NO decoder) — [4,3,4] = 48-d, prior-aligned bounds
  voxel_dims: [4, 3, 4]
  x_lo: 0.2
  x_hi: 1.0
  x_mean: 0.6
  phi_lo: -0.5
  phi_hi: 0.5
  # budgeted adaptive multi-fidelity
  vhat_a1: 1.0
  vhat_a2: 1.0
  vhat_a3: 0.5
  vhat_a4: 1.0
  fidelity_eta_nu: 0.05
  # exploration radius (Fix C)
  sigma_max: 0.7
  # controller (learned defaults; sinusoid via override). embed/hidden for learned.
  controller_type: learned
  controller_latent_dim: 24
  controller_hidden: 64
  controller_embed_dim: 8
  critic_enabled: false
  eta_c: 1.0e-3
  shac_h: 16
  show_tqdm: true
