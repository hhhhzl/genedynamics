# JAX-MPM smoke test: K=2 bridge steps, 4 proposals, 2 modes. ~1 min target.
# Validates end-to-end pipeline with the new task_domain.
name: co_design_jaxmpm_smoke
output_dir: results/jaxmpm_smoke
checkpoint_dir: results/jaxmpm_smoke/checkpoints

baseline_name: mrmfmbd
task_domain: jax_mpm
task_id: crawling_ground
seeds: [0]
save_gif: false

evaluator_runtime:
  max_workers: 1
  reward_shaping_weight: 100.0
  n_grid: 64

scheduler_config:
  type: composite
  diffusion_schedulers:
    - type: fixed
      M_k: 4
      T_k: 0.5
      Ndiffuse: 2
      beta0: 1.0e-4
      betaT: 2.0e-2
  diffusion_merge_strategy: merge

method_params:
  backend: mbd
  num_modes: 2
  num_fidelity_levels: 2
  fidelity_ladder_type: geometric
  fidelity_step_ratio: 0.5
  fine_fidelity_level: 1
  reward_temperature_min: 0.1
  tau_frac: 0.1
  top_k_fine: 1
  show_tqdm: true
