# Phase B MBD — quick K=4 validation. Goal: end-to-end run + gif < 20 min.
# Tests both fixes:
#   * results.json saved before evaluator.close() (deadlock-safe)
#   * _capture_rollout in spawn subprocess (no JAX↔Taichi CUDA conflict)
name: co_design_phase_b_s1_id_mbd_k4
output_dir: results/phase_b/s1_id_mbd_k4
checkpoint_dir: results/phase_b/checkpoints_mbd_k4

baseline_name: mrmfmbd
task_id: crawling_ground
seeds: [0]
save_gif: true

softzoo_ti_arch: cuda
ti_device_memory_fraction: 0.3

evaluator_runtime:
  max_workers: 1
  max_tasks_per_child: null
  cache_size: 0
  reward_shaping_weight: 100.0     # blended: per_step_velocity + 100 * displacement
  reward_shaping_only: false

scheduler_config:
  type: composite
  diffusion_schedulers:
    - type: fixed
      M_k: 4
      T_k: 0.5
      Ndiffuse: 4
      beta0: 1.0e-4
      betaT: 2.0e-2
  diffusion_merge_strategy: merge

method_params:
  backend: mbd
  num_modes: 4
  num_fidelity_levels: 2          # only coarse + medium for K=4 (skip fine)
  fidelity_ladder_type: geometric
  fidelity_step_ratio: 0.5         # coarse-heavy (the right way per docstring)
  fine_fidelity_level: 1           # validate at "fine" = level 1 (medium)
  reward_temperature_min: 0.1
  tau_frac: 0.1
  top_k_fine: 1
  show_tqdm: true
