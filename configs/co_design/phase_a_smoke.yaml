# Phase A: Smoke test — verify end-to-end pipeline runs
name: co_design_phase_a_smoke
output_dir: results/phase_a/smoke
checkpoint_dir: results/phase_a/checkpoints

baseline_name: mrmfmbd
task_id: crawling_ground
seeds: [0]
save_gif: true

softzoo_ti_arch: cpu

# max_workers >=1 forces ProcessPoolExecutor subprocesses for each rollout.
# Required because Taichi 1.7.4 cannot reinitialize cleanly in the same
# process, so in-process sequential rollouts crash at the 2nd env creation.
evaluator_runtime:
  max_workers: 2
  cache_size: 0

scheduler_config:
  type: composite
  diffusion_schedulers:
    - type: fixed
      M_k: 2
      T_k: 0.1
      Ndiffuse: 2
      beta0: 1e-6
      betaT: 1.0
  diffusion_merge_strategy: merge

method_params:
  num_modes: 1
  num_fidelity_levels: 1
  fine_fidelity_level: 0
  show_tqdm: true
