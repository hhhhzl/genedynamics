# Phase E: CMA-ES baseline — in-distribution (crawling_ground)
# Same total rollout budget as MRMFMBD for fair comparison
name: co_design_phase_e_cmaes_id
output_dir: results/phase_e/cmaes_id
checkpoint_dir: results/phase_e/checkpoints

baseline_name: cmaes
task_id: crawling_ground
seeds: [0, 1, 2]

scheduler_config:
  type: composite
  diffusion_schedulers:
    - type: fixed
      M_k: 4
      T_k: 0.1
      Ndiffuse: 12
      beta0: 1e-6
      betaT: 1.0
  diffusion_merge_strategy: merge

method_params:
  num_modes: 4
  popsize: 8
  sigma0: 0.3
  show_tqdm: true
