# Phase D: Full S1+S3 joint — obstacle crossing task
# Tests generalization to a different task (not just crawling)
name: co_design_phase_d_obstacle
output_dir: results/phase_d/obstacle
checkpoint_dir: results/phase_d/checkpoints

baseline_name: mrmfmbd
task_id: obstacle_crossing
seeds: [0, 1, 2]

scheduler_config:
  type: composite
  diffusion_schedulers:
    - type: fixed
      M_k: 6
      T_k: 0.1
      Ndiffuse: 30
      beta0: 1e-6
      betaT: 1.0
  diffusion_merge_strategy: merge

method_params:
  num_modes: 4
  num_fidelity_levels: 3
  fidelity_ladder_type: geometric
  fidelity_step_ratio: 1.5
  show_tqdm: true
