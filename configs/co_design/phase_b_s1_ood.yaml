# Phase B: S1 validation — full S1 mode marginalization, out-of-distribution
# OOD should be more stable; responsibilities show interpretable shift
name: co_design_phase_b_s1_ood
output_dir: results/phase_b/s1_ood
checkpoint_dir: results/phase_b/checkpoints

baseline_name: mrmfmbd
task_id: crawling_desert
seeds: [0, 1, 2]

scheduler_config:
  type: composite
  diffusion_schedulers:
    - type: fixed
      M_k: 4
      T_k: 0.1
      Ndiffuse: 12
      beta0: 1e-6
      betaT: 1.0
  diffusion_merge_strategy: merge

method_params:
  num_modes: 4
  num_fidelity_levels: 1
  show_tqdm: true
