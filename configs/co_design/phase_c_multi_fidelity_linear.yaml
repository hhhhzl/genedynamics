# Phase C: S3 validation — multi-fidelity with linear ladder (ablation)
# Ablation: linear vs geometric allocation
name: co_design_phase_c_multi_fidelity_linear
output_dir: results/phase_c/multi_fidelity_linear
checkpoint_dir: results/phase_c/checkpoints

baseline_name: mrmfmbd
task_id: crawling_ground
seeds: [0, 1, 2]

scheduler_config:
  type: composite
  diffusion_schedulers:
    - type: fixed
      M_k: 4
      T_k: 0.1
      Ndiffuse: 12
      beta0: 1e-6
      betaT: 1.0
  diffusion_merge_strategy: merge

method_params:
  num_modes: 4
  num_fidelity_levels: 3
  fidelity_ladder_type: linear   # equal steps per level
  show_tqdm: true
