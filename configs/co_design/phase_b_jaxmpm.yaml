# Phase B with JAX-MPM backend. Target: full K=16 run < 2 min.
name: co_design_phase_b_jaxmpm
output_dir: results/phase_b/jaxmpm
checkpoint_dir: results/phase_b/checkpoints_jaxmpm

baseline_name: mrmfmbd
task_domain: jax_mpm
task_id: crawling_ground
seeds: [0]
save_gif: true

evaluator_runtime:
  max_workers: 1
  reward_shaping_weight: 100.0
  n_grid: 64

scheduler_config:
  type: composite
  diffusion_schedulers:
    - type: fixed
      M_k: 128                   # 1.66 sample/dim for 77-dim co-design (27 voxel + 50 controller)
      T_k: 0.5
      Ndiffuse: 100              # K=100 to see full convergence curve
      beta0: 1.0e-4
      betaT: 2.0e-2
  diffusion_merge_strategy: merge

method_params:
  backend: mbd
  num_modes: 4
  num_fidelity_levels: 3
  fidelity_ladder_type: geometric
  fidelity_step_ratio: 0.5
  fine_fidelity_level: 2
  reward_temperature_min: 0.05   # sharper final anneal
  tau_frac: 0.05                 # less exploration noise late
  top_k_fine: 5
  show_tqdm: true
  # tanh(W·sin+b) controller: phi_dim=50 (10 actuators × 4 waves + 10 bias).
  phi_dim_override: true
  phi_lo: -2.0
  phi_hi: 2.0
  phi_std: 0.5
  # Voxel morphology (4×4×4 = 64 occupancy cells), [0,1]; mean 0.7 = mostly-occupied prior.
  x_lo: 0.0
  x_hi: 1.0
  x_mean: 0.7
  x_std: 0.25
