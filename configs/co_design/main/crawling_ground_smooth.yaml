# Smoothness variant of main/crawling_ground.yaml.
#
# Only difference vs main: add backward_penalty_weight=10.0 — penalizes
# Σ_t max(0, -v_x[t]) to suppress the lunge-then-recoil pattern that
# current main's trajectory shows (disp spikes at t=50 → dips at t=75 →
# spikes at t=100 → dips at t=150). Target outcome: disp_t curve closer to
# monotonic, CV across friction modes tighter.
name: mrmfmbd_crawling_ground_smooth
output_dir: results/co_design/main/crawling_ground_smooth
cache_dir: results/co_design/main/crawling_ground_smooth_cache

baseline_name: mrmfmbd
task_domain: jax_mpm
task_id: crawling_ground
seeds: [0]
save_gif: true

evaluator_runtime:
  max_workers: 1
  reward_shaping_weight: 100.0
  n_grid: 64
  voxel_dims: [4, 3, 4]
  act_strength_base: 24.0
  scale: 50.0
  backward_penalty_weight: 10.0   # <-- smoothness knob (main uses 0.0)

scheduler_config:
  type: composite
  diffusion_schedulers:
    - type: fixed
      M_k: 32
      T_k: 0.5
      Ndiffuse: 100
      beta0: 1.0e-4
      betaT: 2.0e-2
  diffusion_merge_strategy: merge

method_params:
  backend: mbd
  num_modes: 4
  num_fidelity_levels: 3
  fidelity_ladder_type: geometric
  fidelity_step_ratio: 1.5
  fine_fidelity_level: 2
  reward_temperature_min: 0.05
  tau_frac: 0.05
  top_k_fine: 5
  show_tqdm: true
  morphology_symmetry: z
  phi_dim_override: true
  phi_lo: -0.5
  phi_hi: 0.5
  phi_std: 0.15
  x_lo: 0.2
  x_hi: 1.0
  x_mean: 0.6
  x_std: 0.3
