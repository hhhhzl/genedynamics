# Ablation: no diffusion prior (random initialization)
# Tests the value of the prior p0(x) in guiding search
name: co_design_ablation_no_prior
output_dir: results/ablations/no_prior
checkpoint_dir: results/ablations/checkpoints

baseline_name: mrmfmbd
task_id: crawling_ground
seeds: [0, 1, 2]

scheduler_config:
  type: composite
  diffusion_schedulers:
    - type: fixed
      M_k: 4
      T_k: 0.1
      Ndiffuse: 12
      beta0: 1e-6
      betaT: 1.0
  diffusion_merge_strategy: merge

method_params:
  num_modes: 4
  num_fidelity_levels: 1
  use_prior: false          # disable prior score term
  show_tqdm: true
