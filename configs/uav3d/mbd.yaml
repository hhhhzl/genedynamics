# UAV 3D MBD experiment
# Run: python -m genedynamics.experiments.runner configs/uav3d/mbd.yaml

name: uav3d_mbd
output_dir: results/uav3d/mbd

env_name: drone_full_3d_physics
env_params:
  dt: 0.05
  horizon: 28
  target: [0.0, 0.0, 1.0]
  control_limit: 1.0
  physics_backend: drone_model  # NumPy backend; mjx has drone model compat issues

method: mbd
method_params:
  Nsample: 1024
  Ndiffuse: 150
  temp_sample: 0.05
  terminal_energy_weight: 8000.0
  show_tqdm: true

obstacle_levels: [0]
obstacle_config:
  generator: box3d
  robot_radius: 0.1
  success_margin: 0.2
  obstacle_radius_scale: 1.3
  p_max: 2.0
  obstacle_type: sphere
  map_bounds:
    x_min: -1.5
    x_max: 1.5
    y_min: -1.5
    y_max: 1.5
    z_min: 0.0
    z_max: 2.0

seeds: [0, 1, 2]
backend: jax
device: cpu

metrics: [ssr, obstacle_density]
visualizations: [trajectory_3d]  # diffusion_3d has drone MJX compat issues
