# UAV 3D Deploy with MBD (matches experiment configs/uav3d/mbd.yaml)
# Run: genedynamics-deploy --config configs/uav3d/deploy_mbd.yaml

name: uav3d_deploy_mbd
output_dir: results/deploy/uav3d_mbd_sim

# Start 1.5-2.5 units from target for longer planning distance
start_mode: near_target
start_min_dist: 1.5
start_max_dist: 2.5

env_name: drone_full_3d_physics
env_params:
  dt: 0.05
  horizon: 28
  target: [0.0, 0.0, 1.0]
  control_limit: 1.0
  physics_backend: drone_model
  use_jax_for_transition: true  # Required for SSR=1: deploy must use same JAX dynamics as MBD planner
  euler_max: 0.5   # Max roll/pitch/yaw (rad) for smooth flight
  ang_vel_max: 1.5 # Max angular velocity (rad/s) for smoother flight
  orientation_weight: 1.0  # Stronger orientation penalty in cost

method: mbd
method_params:
  Nsample: 1024   # Match experiment for SSR=1
  Ndiffuse: 150
  temp_sample: 0.05
  terminal_energy_weight: 8000.0
  show_tqdm: false

execution_mode: sim_only
control_rate_hz: 20.0
plan_rate_hz: 10.0
real_time_factor: 1.0
sync_mode: true
record: true
horizon: 28
