# MDOC ablation: per-step CBF filter (closed-form projection), fixed schedulers
name: single2d_mdoc_cbf_closed_form_perstep
output_dir: results/single2d/ablation_mdoc/cbf_closed_form_perstep

env_name: single_integrator_box_2d
env_params:
  dt: 0.05
  horizon: 64
  p_max: 2.0
  control_limit: 1.0

method: mdoc
method_params:
  show_tqdm: false

  # MDOC ablation switch (used by MDOCMethodPlugin to pick ConstraintFilter)
  mdoc_constraint_mode: cbf_closed_form_perstep

  # CBF params (aligned with `mdoc.py`)
  cbf_tau: 0.005
  cbf_eta: 1.5
  cbf_margin: 0.1
  base_beta: 5.0e-2
  terminal_energy_weight: 50.0

obstacle_levels: [6]
obstacle_config:
  generator: box2d
  robot_radius: 0.05
  obstacle_radius_scale: 1.3
  p_max: 2.0
  map_bounds:
    x_min: -1.5
    x_max: 1.0
    y_min: -2.0
    y_max: 0.5
  enable_connectivity_check: true
  enable_nonconvexity_check: true

seeds: [0]
backend: jax
device: cpu

metrics:
  - ssr
  - obstacle_density
  - nonconvexity

visualizations:
  - trajectory
  - diffusion
  - energy_reward
  - states

scheduler_config:
  type: composite
  constraint_schedulers:
    - type: fixed
      margin: 0.1
      rho: 10.0
      # Closed-form filter: no QP solve
      qp_gate: false
      qp_prob: 0.0
      topK: null
      eps: 1e-4
      I_QP: 10
  diffusion_schedulers:
    - type: fixed
      M_k: 128
      T_k: 1e-1
      Ndiffuse: 100
      beta0: 1.0e-5
      betaT: 1e-2
  constraint_merge_strategy: merge
  diffusion_merge_strategy: merge


