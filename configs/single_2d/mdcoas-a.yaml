# MDCOAS-A: MDCOAS with ALM scheduler, no QP (p_min=p_max=0).
# Semantics: c_k ≡ 0 (no QP), so compute dual ν_k → 0; no compute budget control.
name: single2d_mdcoas
output_dir: results/single2d/mdcoas-a

env_name: single_integrator_box_2d
env_params:
  dt: 0.05
  horizon: 64
  p_max: 2.0
  control_limit: 1.0

method: cfsmbd_full
method_params:
  show_tqdm: True
  action_extra_sigma: 0.3
  use_batched_alm_adaptive: False

  # CFS parameters
  max_constraints_per_point: 5
  constraint_margin: 0.05

  # Augmented Lagrangian: initial values only; alm_adaptive updates them
  aug_lambda: 0.0
  aug_rho: 1.0

  # Multi-mode: number of candidate trajectories to return (C paths)
  num_modes: 20
  mode_strategy: multirun

obstacle_levels: [10]
obstacle_config:
  generator: box2d
  robot_radius: 0.05
  obstacle_radius_scale: 1.0
  p_max: 2.0
  map_bounds:
    x_min: -1.5
    x_max: 1.0
    y_min: -2.0
    y_max: 0.5
  enable_connectivity_check: true
  enable_nonconvexity_check: true

seeds: [0]
backend: jax
device: cuda

metrics:
  - ssr
  - obstacle_density
  - nonconvexity

visualizations:
  - trajectory_modes
  - trajectory
  - diffusion
  - cost
  - adaptive

scheduler_config:
  type: composite
  constraint_schedulers:
    - type: alm_adaptive
      margin: 0.05
      lam0: 0.0
      rho0: 1.0
      nu0: 0.0
      compute_cost_mode: product   # product | linear
      compute_cost_a0: 0.0
      compute_cost_aK: 1.0
      compute_cost_aI: 1.0
      compute_cost_use_qp_gate: false
      compute_budget_B: 8.0
      compute_budget_time_profile: constant   # constant | gaussian_bump
      compute_budget_time_amp: 2.0
      compute_budget_time_mu: 0.5
      compute_budget_time_sigma: 0.2
      eta_nu: 0.05
      nu_max: 0.0

      # ALM
      eta_lam_forget: 0.02
      rho_min: 0.5
      rho_tau_hi: 5.0e-4
      rho_tau_lo: 1.0e-4
      rho_gamma_up: 2.0
      rho_gamma_down: 1.5
      rho_good_steps: 5
      gamma: 2.0
      rho_max: 500.0
      kappa: 0.9
      r_tol: 5e-4

      # Non-monotone controller
      v_signal_mode: rate   # rate | mean
      v_star: 0.0
      v_ema_beta: 0.3
      v_tau_hi: 0.05
      v_tau_lo: 0.01

      # p controller: non-monotone response to dv and v-v*
      eta_p: 2.0
      eta_p_plus: 2.0
      eta_p_minus: 0.3
      eta_c_p: 0.2

      # topK controller
      eta_topK: 10.0
      eta_topK_plus: 10.0
      eta_topK_minus: 2.0
      eta_c_topK: 1.0

      # I controller
      eta_I: 8.0
      eta_I_plus: 8.0
      eta_I_minus: 2.0
      eta_c_I: 1.0

      # eps controller (smaller eps = more accurate)
      eta_eps: 0.01
      eta_eps_plus: 0.01
      eta_eps_minus: 0.003
      eta_c_eps: 0.01

      # No QP effort control
      p_min: 0.0
      p_max: 0.0
      eps_min: 0.0
      eps_max: 0.0
      I_min: 0
      I_max: 0
      topK_min: 0
      topK_max: 0
      use_stochastic_gate: false
  diffusion_schedulers:
    - type: fixed
      M_k: 64
      T_k: 5e-1
      Ndiffuse: 100
      beta0: 1e-5
      betaT: 1e-2
  constraint_merge_strategy: merge
  diffusion_merge_strategy: merge
