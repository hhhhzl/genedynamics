# CFS-MBD: MBD with Augmented Lagrangian objective and CFS-based per-step QP projection
name: single2d_cfsmbd
output_dir: results/single2d/cfsmbd

env_name: single_integrator_box_2d
env_params:
  dt: 0.05
  horizon: 64
  p_max: 2.0
  control_limit: 1.0

method: cfsmbd
method_params:
  show_tqdm: True

  # CFS parameters
  max_constraints_per_point: 5
  constraint_margin: 0.05  # Reduced from 0.25: tighter obstacle selection threshold

  # Augmented Lagrangian parameters (fixed for now)
  aug_lambda: 10.0  # Dual variable
  aug_rho: 20.0     # Penalty parameter

obstacle_levels: [6]
obstacle_config:
  generator: box2d
  robot_radius: 0.05
  obstacle_radius_scale: 1.3
  p_max: 2.0
  map_bounds:
    x_min: -1.5
    x_max: 1.0
    y_min: -2.0
    y_max: 0.5
  enable_connectivity_check: true
  enable_nonconvexity_check: true

seeds: [0]
backend: jax
device: cpu

metrics:
  - ssr
  - obstacle_density
  - nonconvexity

visualizations:
  - trajectory
  - diffusion
  - energy_reward
  - states

scheduler_config:
  type: composite
  constraint_schedulers:
    - type: fixed
      margin: 0.18
      rho: 10.0
      # QP filter: always solve per-step
      qp_gate: true
      qp_prob: 1.0
      topK: null
      eps: 1e-4
      I_QP: 10
  diffusion_schedulers:
    - type: fixed
      M_k: 512
      T_k: 5e-1
      Ndiffuse: 100
      beta0: 1.0e-5
      betaT: 1e-2
  constraint_merge_strategy: merge
  diffusion_merge_strategy: merge
