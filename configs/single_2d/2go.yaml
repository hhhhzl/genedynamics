name: single2d_2go_phase1
output_dir: results/single2d/2go

env_name: single_integrator_box_2d
env_params:
  dt: 0.05
  horizon: 64
  p_max: 2.0
  control_limit: 1.0

method: 2go
method_params:
  show_tqdm: true
  action_extra_sigma: 0.3

  # CFS parameters
  max_constraints_per_point: 10
  constraint_margin: 0.25

  # Augmented Lagrangian parameters
  aug_lambda: 300.0
  aug_rho: 500.0

  # Multi-mode
  num_modes: 20
  mode_strategy: multirun

  # 2GO gating/schedule knobs (Phase-1 diagnostics/proxy coupling)
  twogo_sigma_max: 0.25
  twogo_gate_vrate_threshold: 0.01
  twogo_sigma_q: 1.0
  twogo_sigma_q_lambda: 1.0
  twogo_delta0: 0.02
  twogo_delta_r: 1.0
  twogo_delta_r_lambda: 1.0
  twogo_lambda0: 1.0
  twogo_theta_start: 0.6
  twogo_theta_end: 0.2
  twogo_cvar_alpha: 0.9
  twogo_window_size: 16
  twogo_window_stride: 8
  twogo_tail_ratio: 0.3
  twogo_active_topk: 8
  twogo_agp_eta: 0.08
  twogo_cfs_gain: 0.35
  twogo_multi_scale: 0.25
  twogo_enable_agp_refine: false
  twogo_enable_local_gating: true
  twogo_enable_sample_tail: true
  twogo_enable_agp_batch: false
  twogo_use_jax_scan_core: true
  twogo_retract_qp_boost: true
  twogo_stability_eps: 1e-6
  twogo_gamma_init: 1.0
  # Mean retraction: every N diffusion steps, or when CVaR(tail violations) > delta_k
  twogo_retract_qp_every: 2
  # Tail-mixture B-probe → Geo₁ (predictor–corrector); α=0 disables probe residual in geometry only
  twogo_probe_enable: true
  twogo_probe_tail_mix: 0.5
  twogo_probe_tail_pool_ratio: 0.25
  twogo_probe_geom_alpha: 0.25
  # B: explicit count, or omit and use twogo_probe_frac * Nsample
  twogo_probe_b: 64
  twogo_probe_frac: 0.5
  # twogo_probe_m_cap: 64   # optional: cap vmap length

obstacle_levels: [10]
obstacle_config:
  generator: box2d
  robot_radius: 0.05
  obstacle_radius_scale: 1.0
  p_max: 2.0
  map_bounds:
    x_min: -1.5
    x_max: 1.0
    y_min: -2.0
    y_max: 0.5
  enable_connectivity_check: true
  enable_nonconvexity_check: true

seeds: [0]
backend: jax
device: cuda

metrics:
  - ssr
  - obstacle_density
  - nonconvexity

visualizations:
  - trajectory_modes
  - trajectory
  - diffusion
  - cost
  - adaptive

scheduler_config:
  type: composite
  constraint_schedulers:
    - type: twogo
      margin: 0.05
      lam_start: 50.0
      lam_end: 500.0
      lam_power: 1.0
      kappa0: 1.0
      kappa_gain: 0.01
      delta0: 0.02
      delta_power: 1.0
      delta_lambda_power: 1.0
      lambda0: 1.0
      cvar_alpha: 0.9
      qp_prob_min: 0.0
      qp_prob_max: 1.0
      topK_min: 1
      topK_max: 8
      I_QP_min: 1
      I_QP_max: 5
      eps_min: 1e-5
      eps_max: 1e-2
  # constraint_schedulers:
  #   - type: alm_adaptive
  #     margin: 0.05
  #     lam0: 0.0
  #     rho0: 1.0
  #     nu0: 0.0
