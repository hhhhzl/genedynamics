name: single2d_2go_phase1
output_dir: results/single2d/2go

env_name: single_integrator_box_2d
env_params:
  dt: 0.05
  horizon: 64
  p_max: 2.0
  control_limit: 1.0

method: 2go
method_params:
  show_tqdm: true
  action_extra_sigma: 0.3

  # CFS parameters
  max_constraints_per_point: 10
  constraint_margin: 0.25

  # Augmented Lagrangian: initial values only; alm_adaptive updates them
  aug_lambda: 0.0
  aug_rho: 1.0

  # Multi-mode
  num_modes: 20
  mode_strategy: multirun

  # 2GO geometry / gating knobs
  twogo_gate_vrate_threshold: 0.01
  twogo_cvar_alpha: 0.9
  twogo_window_size: 16
  twogo_window_stride: 8
  twogo_tail_ratio: 0.3
  twogo_active_topk: 8
  twogo_agp_eta: 0.08
  twogo_cfs_gain: 0.35
  twogo_multi_scale: 0.25
  twogo_enable_agp_refine: false
  twogo_enable_local_gating: true
  twogo_enable_sample_tail: true
  twogo_enable_agp_batch: false
  twogo_use_jax_scan_core: true
  twogo_retract_qp_boost: true
  twogo_stability_eps: 1e-6
  twogo_gamma_init: 1.0
  # Mean retraction: every N diffusion steps, or when CVaR(tail violations) > delta_k
  twogo_retract_qp_every: 1
  # Tail-mixture B-probe → Geo₁ (predictor–corrector); α=0 disables probe residual in geometry only
  twogo_probe_enable: true
  twogo_probe_tail_mix: 0.5
  twogo_probe_tail_pool_ratio: 0.25
  twogo_probe_geom_alpha: 0.25
  # B: explicit count, or omit and use twogo_probe_frac * Nsample
  twogo_probe_b: 16
  # twogo_probe_frac: 0.5
  # twogo_probe_m_cap: 64   # optional: cap vmap length
  twogo_overlay:
    hardness:
      rho_ref: 500.0
    constraint:
      kappa0: 1.0
      kappa_rho_gain: 0.01
      delta_margin_scale: 0.4
      delta_rho_gain: 0.02
      delta_min: 5e-4
    diffusion:
      sigma_max: 0.25
      sigma_hardness_power: 1.0
      theta_max: 0.6
      theta_min: 0.2
      eta_scale_min: 0.5
      eta_scale_max: 1.0
      eta_hardness_power: 1.0
      gate_every: 1

obstacle_levels: [10]
obstacle_config:
  generator: box2d
  robot_radius: 0.05
  obstacle_radius_scale: 1.0
  p_max: 2.0
  map_bounds:
    x_min: -1.5
    x_max: 1.0
    y_min: -2.0
    y_max: 0.5
  enable_connectivity_check: true
  enable_nonconvexity_check: true

seeds: [0]
backend: jax
device: cuda

metrics:
  - ssr
  - obstacle_density
  - nonconvexity

visualizations:
  - trajectory_modes
  - trajectory
  - diffusion
  - cost
  - adaptive

scheduler_config:
  type: composite
  constraint_schedulers:
    - type: alm_adaptive
      margin: 0.05
      lam0: 0.0
      rho0: 1.0
      nu0: 0.0
      compute_cost_mode: product
      compute_cost_a0: 0.0
      compute_cost_aK: 1.0
      compute_cost_aI: 1.0
      compute_cost_use_qp_gate: false
      compute_budget_B: 8.0
      compute_budget_time_profile: constant
      compute_budget_time_amp: 2.0
      compute_budget_time_mu: 0.5
      compute_budget_time_sigma: 0.2
      eta_nu: 0.05
      nu_max: 0.0
      eta_lam_forget: 0.02
      rho_min: 0.5
      rho_tau_hi: 5.0e-4
      rho_tau_lo: 1.0e-4
      rho_gamma_up: 2.0
      rho_gamma_down: 1.5
      rho_good_steps: 5
      gamma: 2.0
      rho_max: 500.0
      kappa: 0.9
      r_tol: 5e-4
      v_signal_mode: rate
      v_star: 0.0
      v_ema_beta: 0.3
      v_tau_hi: 0.05
      v_tau_lo: 0.01
      eta_p: 2.0
      eta_p_plus: 2.0
      eta_p_minus: 0.3
      eta_c_p: 0.2
      eta_topK: 10.0
      eta_topK_plus: 10.0
      eta_topK_minus: 2.0
      eta_c_topK: 1.0
      eta_I: 8.0
      eta_I_plus: 8.0
      eta_I_minus: 2.0
      eta_c_I: 1.0
      eta_eps: 0.01
      eta_eps_plus: 0.01
      eta_eps_minus: 0.003
      eta_c_eps: 0.01
      p_min: 0.0
      p_max: 1.0
      eps_min: 1e-5
      eps_max: 1e-2
      I_min: 1
      I_max: 5
      topK_min: 1
      topK_max: 8
      use_stochastic_gate: true
  diffusion_schedulers:
    - type: fixed
      M_k: 64
      T_k: 5e-1
      Ndiffuse: 100
      beta0: 1e-5
      betaT: 1e-2
  constraint_merge_strategy: merge
  diffusion_merge_strategy: merge

