  #     use_stochastic_gate: true
  diffusion_schedulers:
    - type: twogo
      M_k: 64
      T_k: 5e-1
      sigma_max: 0.25
      theta_start: 0.6
      theta_end: 0.2
      q: 1.0
      q_lambda: 1.0
      lambda0: 1.0
      lam_start: 50.0
      lam_end: 500.0
      lam_power: 1.0
      gate_every: 1
  constraint_merge_strategy: merge
  diffusion_merge_strategy: merge

