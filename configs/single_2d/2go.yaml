  #     eta_nu: 0.05
  #     nu_max: 0.0

  #     # Non-monotone ALM (λ forgetting + ρ hysteresis)
  #     eta_lam_forget: 0.02
  #     rho_min: 0.5
  #     rho_tau_hi: 5.0e-4
  #     rho_tau_lo: 1.0e-4
  #     rho_gamma_up: 2.0
  #     rho_gamma_down: 1.5
