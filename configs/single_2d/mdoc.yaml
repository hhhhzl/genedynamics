# MDOC ablation: per-step CBF filter (QP projection), fixed schedulers
name: single2d_mdoc
output_dir: results/single2d/mdoc

env_name: single_integrator_box_2d
env_params:
  dt: 0.05
  horizon: 64
  p_max: 2.0
  control_limit: 1.0

method: mdoc
method_params:
  show_tqdm: True

  # MDOC ablation switch (used by MDOCMethodPlugin to pick ConstraintFilter)
  mdoc_constraint_mode: cbf_qp_perstep
  cbf_tau: 0.005
  cbf_eta: 1.5
  cbf_margin: 0.04
  base_beta: 5.0e-2
  terminal_energy_weight: 100.0
  # Multi-mode: number of candidate trajectories to return (C paths)
  num_modes: 20
  mode_strategy: multirun

  # Visualization style
  mdoc_viz_style: "cap" # cap | rectangle    
  mdoc_viz_scale: 1.0
  mdoc_viz_band: 1          
  mdoc_viz_use_beta: False
  mdoc_viz_draw_disk: False
  mdoc_viz_draw_grad: False

obstacle_levels: [10]
obstacle_config:
  generator: box2d
  robot_radius: 0.05
  obstacle_radius_scale: 1.3
  p_max: 2.0
  map_bounds:
    x_min: -1.5
    x_max: 1.0
    y_min: -2.0
    y_max: 0.5
  enable_connectivity_check: true
  enable_nonconvexity_check: true

seeds: [0]
backend: jax
device: cpu

metrics:
  - ssr
  - obstacle_density
  - nonconvexity

visualizations:
  - trajectory_modes  # Shows C candidate paths with best highlighted
  - trajectory        # Shows only the best (lowest cost) path
  - diffusion
  - energy_reward
  - states

scheduler_config:
  type: composite
  constraint_schedulers:
    - type: fixed
      margin: 0.04
      rho: 10.0
      # QP filter: always solve per-step
      qp_gate: true
      qp_prob: 1.0
      topK: null
      eps: 1e-4
      I_QP: 10
  diffusion_schedulers:
    - type: fixed
      M_k: 64
      T_k: 5e-1
      Ndiffuse: 100
      beta0: 1.0e-5
      betaT: 1e-2
  constraint_merge_strategy: merge
  diffusion_merge_strategy: merge


