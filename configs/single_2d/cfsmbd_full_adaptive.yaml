# CFS-MBD full trajectory QP with ALM adaptive constraint scheduling
# Same as cfsmbd_full but uses alm_adaptive scheduler (residual-driven lambda/rho + QP effort).
name: single2d_cfsmbd_full_adaptive
output_dir: results/single2d/cfsmbd_full_adaptive

env_name: single_integrator_box_2d
env_params:
  dt: 0.05
  horizon: 64
  p_max: 2.0
  control_limit: 1.0

method: cfsmbd_full
method_params:
  show_tqdm: True

  # CFS parameters
  max_constraints_per_point: 5
  constraint_margin: 0.05

  # Augmented Lagrangian: initial values only; alm_adaptive updates them
  aug_lambda: 0.0
  aug_rho: 1.0

  # Multi-mode: number of candidate trajectories to return (C paths)
  num_modes: 50
  mode_strategy: multirun

obstacle_levels: [3]
obstacle_config:
  generator: box2d
  robot_radius: 0.05
  obstacle_radius_scale: 1.3
  p_max: 2.0
  map_bounds:
    x_min: -1.5
    x_max: 1.0
    y_min: -2.0
    y_max: 0.5
  enable_connectivity_check: true
  enable_nonconvexity_check: true

seeds: [0]
backend: jax
device: cpu

metrics:
  - ssr
  - obstacle_density
  - nonconvexity

visualizations:
  - trajectory_modes  # Shows C candidate paths with best highlighted
  - trajectory        # Shows only the best (lowest cost) path
  - diffusion
  - energy_reward
  - states

scheduler_config:
  type: composite
  constraint_schedulers:
    - type: alm_adaptive
      lam0: 0.0
      rho0: 1.0
      gamma: 2.0
      rho_max: 1000.0
      kappa: 0.9
      r_tol: 5e-4
      margin: 0.18
      p_min: 0.2
      p_max: 1.0
      eps_min: 1e-5
      eps_max: 1e-2
      I_min: 1
      I_max: 20
      topK_min: 1
      topK_max: 30
      use_stochastic_gate: false
  diffusion_schedulers:
    - type: fixed
      M_k: 64
      T_k: 5e-1
      Ndiffuse: 100
      beta0: 1.0e-5
      betaT: 1e-2
  constraint_merge_strategy: merge
  diffusion_merge_strategy: merge
