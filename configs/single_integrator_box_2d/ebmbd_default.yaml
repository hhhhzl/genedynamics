# EB-MBD experiment configuration for single_integrator_box_2d environment
name: single2d_ebmbd_default
output_dir: results/single2d/ebmbd

env_name: single_integrator_box_2d
env_params:
  dt: 0.05
  horizon: 64
  p_max: 2.0
  control_limit: 1.0

method: ebmbd
method_params:
  Ndiffuse: 100
  Nsample: 128
  temp_sample: 0.3
  beta0: 1.0e-4
  betaT: 5.0e-2
  action_limit: 1.0
  action_extra_sigma: 0.3
  # Align with EDOC: strong terminal objective helps actually reach the target
  terminal_energy_weight: 100.0
  # Emerging barrier parameters
  mu: 10.0
  alpha: 1.0
  bound: 0.8
  use_min_over_time: true

obstacle_levels: [9]
obstacle_config:
  generator: box2d
  robot_radius: 0.05
  obstacle_radius_scale: 1.3
  p_max: 2.0
  map_bounds:
    x_min: -1.5
    x_max: 1.0
    y_min: -2.0
    y_max: 0.5
  enable_connectivity_check: true
  enable_nonconvexity_check: true

seeds: [0]
backend: jax
device: cpu

metrics:
  - ssr
  - obstacle_density
  - nonconvexity

visualizations:
  - trajectory
  - diffusion
  - energy_reward
  - states

metadata:
  description: "EB-MBD default configuration for single integrator 2D environment"
  author: "enerdynamics"

