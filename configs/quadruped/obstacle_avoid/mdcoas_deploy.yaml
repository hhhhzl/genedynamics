# Quadruped obstacle_avoid MD-COAS deploy
# Run: genedynamics-deploy --config configs/quadruped/obstacle_avoid/mdcoas_deploy.yaml

name: quadruped_obstacle_avoid
output_dir: results/deploy/quadruped_obstacle_avoid

start_mode: near_target
start_min_dist: 1.0
start_max_dist: 2.0

env_name: quadruped_go2_mjx
env_params:
  dt: 0.05
  horizon: 64
  target: [2.0, 0.0, 0.5]
  control_limit: 1.0
  model: go2

method: cfsmbd_full
method_params:
  Nsample: 512
  Ndiffuse: 100
  max_constraints_per_point: 8
  constraint_margin: 0.25

task:
  task_type: obstacle_avoid
  obstacles:
    type: sphere
    level: 2
    robot_radius: 0.15
    generator: box3d
    map_bounds:
      x_min: -1.0
      x_max: 3.0
      y_min: -1.5
      y_max: 1.5
      z_min: 0.0
      z_max: 1.0

execution_mode: sim_only
control_rate_hz: 20.0
plan_rate_hz: 10.0
record: true
horizon: 64
