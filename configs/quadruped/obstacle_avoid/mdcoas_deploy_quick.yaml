# Quadruped obstacle_avoid MD-COAS deploy quick (Ant, level 1)
# Run: genedynamics-deploy --config configs/quadruped/obstacle_avoid/mdcoas_deploy_quick.yaml

name: quadruped_obstacle_avoid_quick
output_dir: results/deploy/quadruped_obstacle_avoid

start_mode: near_target
start_min_dist: 1.0
start_max_dist: 1.5
start_min_z: 0.45

method: cfsmbd_full
env_name: quadruped_flat_mjx
env_params:
  dt: 0.05
  horizon: 48
  target: [2.0, 0.0, 0.5]
  control_limit: 1.0
  model: flat

method_params:
  Nsample: 128
  Ndiffuse: 30
  max_constraints_per_point: 8
  constraint_margin: 0.25
  show_tqdm: false

task:
  task_type: obstacle_avoid
  obstacles:
    type: sphere
    level: 1
    robot_radius: 0.15
    generator: box3d
    map_bounds:
      x_min: -0.5
      x_max: 2.5
      y_min: -1.0
      y_max: 1.0
      z_min: 0.0
      z_max: 1.0

execution_mode: sim_only
control_rate_hz: 20.0
plan_rate_hz: 10.0
record: true
horizon: 48
