name: quadruped_stepping_stones_2d_mbd
output_dir: results/quadruped/stepping_stones_2d/main/mbd

env_name: quadruped_stepping_stones_2d
env_params:
  dt: 1.0
  horizon: 36
  l_max: 0.35
  body_shift_limit: 0.24
  stance_width: 0.30
  terminal_foot_penalty: 0.50
  terminal_foot_margin: 0.20
  start_mid: [-1.25, 0.0]
  goal_mid: [1.25, 0.0]
  control_limit: 0.45

method: mbd
method_params:
  show_tqdm: true
  action_extra_sigma: 0.02
  terminal_energy_weight: 120.0
  num_modes: 8
  mode_strategy: multirun

obstacle_levels: [1, 2, 3, 4, 5, 6]
obstacle_config:
  generator: stepping_stones_2d
  robot_radius: 0.03
  success_margin: 0.12
  terminal_foot_margin: 0.20
  l_max: 0.35
  stance_width: 0.30

seeds: [0, 1, 2, 3, 4]
backend: jax
device: cuda

metrics: [stepping_metrics]
visualizations: [stepping_trajectory, stepping_modes]

scheduler_config:
  type: composite
  diffusion_schedulers:
    - type: fixed
      M_k: 128
      T_k: 0.12
      Ndiffuse: 64
      beta0: 1e-5
      betaT: 1e-2
  diffusion_merge_strategy: merge

