# Baseline: MPPI with the same rollout budget as the main diffusion experiments.
name: quadruped_stepping_stones_2d_mppi
output_dir: results/quadruped/stepping_stones_2d/main/mppi

env_name: quadruped_stepping_stones_2d
env_params:
  dt: 1.0
  horizon: 16
  l_max: 0.35
  body_shift_limit: 0.24
  stance_width: 0.30
  terminal_reward_weight: 120.0
  terminal_foot_penalty: 0.50
  terminal_foot_margin: 0.20
  start_mid: [-1.25, 0.0]
  goal_mid: [1.25, 0.0]
  control_limit: 0.45

method: mppi
method_params:
  # 512 samples x 100 updates matches the current main M_k x Ndiffuse budget.
  num_samples: 512
  num_iterations: 100
  noise_sigma: 0.20
  lambda_: 1.0
  action_limit: 0.45
  # Match the main MBD/MDOC trajectory objective: time-aware progress guidance
  # plus the same terminal-distance weight.
  terminal_energy_weight: 120.0
  guide_weight: 20.0

obstacle_levels: [1, 5]
obstacle_config:
  generator: stepping_stones_2d
  robot_radius: 0.03
  foothold_margin: 0.05
  success_margin: 0.20
  terminal_foot_margin: 0.20
  l_max: 0.35
  stance_width: 0.30
  k_horizon_cap: 16
  lane_tail_margin: 3
  lane_gap_scale: 0.97

seeds: [0, 1, 2, 3, 4]
backend: jax
device: cuda

metrics: [stepping_metrics]
visualizations: [stepping_trajectory, stepping_modes, cost]
