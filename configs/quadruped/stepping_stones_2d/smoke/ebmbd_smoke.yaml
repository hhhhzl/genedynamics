# EB-MBD smoke: same env/obstacles as mbd_smoke; EB barrier scheduler from configs/single_2d/ebmbd.yaml (adapted).
name: quadruped_stepping_stones_2d_ebmbd_smoke
output_dir: results/quadruped/stepping_stones_2d/smoke/ebmbd

env_name: quadruped_stepping_stones_2d
env_params:
  dt: 1.0
  horizon: 16
  l_max: 0.35
  body_shift_limit: 0.24
  stance_width: 0.30
  terminal_reward_weight: 120.0
  terminal_foot_penalty: 0.50
  terminal_foot_margin: 0.20
  start_mid: [-1.25, 0.0]
  goal_mid: [1.25, 0.0]
  control_limit: 0.45

method: ebmbd
method_params:
  show_tqdm: true
  action_limit: 0.45
  action_extra_sigma: 0.02
  terminal_energy_weight: 120.0
  use_min_over_time: true
  num_modes: 8
  mode_strategy: multirun
  # Barrier defaults (single_2d/ebmbd.yaml); tune margin vs stone scale if needed
  mu: 50.0
  alpha: 1.0
  bound: 0.8

obstacle_levels: [1]
obstacle_config:
  generator: stepping_stones_2d
  robot_radius: 0.03
  foothold_margin: 0.05
  success_margin: 0.20
  terminal_foot_margin: 0.20
  l_max: 0.35
  stance_width: 0.30
  k_horizon_cap: 16
  lane_tail_margin: 3
  lane_gap_scale: 0.97

seeds: [0]
backend: jax
device: cuda

metrics: [stepping_metrics]
visualizations: [stepping_trajectory, stepping_modes, cost, diffusion]

scheduler_config:
  type: composite
  diffusion_schedulers:
    - type: fixed
      M_k: 512
      T_k: 0.3
      Ndiffuse: 100
      beta0: 1e-5
      betaT: 1e-2
  diffusion_merge_strategy: merge
  constraint_schedulers:
    - type: emerging_barrier
      mu: 50.0
      alpha: 1.0
      bound: 0.8
      use_min_over_time: true
      terminal_energy_weight: 120.0
      margin: 0.05
  constraint_merge_strategy: merge
