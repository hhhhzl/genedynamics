# ── Baseline: MD-COAS (CFS-MBD) + ALM adaptive ──
name: quadruped_stepping_stones_2d_mdcoas_smoke
output_dir: results/quadruped/stepping_stones_2d/smoke/mdcoas

env_name: quadruped_stepping_stones_2d
env_params:
  dt: 1.0
  horizon: 16
  l_max: 0.35
  body_shift_limit: 0.24
  stance_width: 0.30
  # Fair vs mbd_smoke: same as MBD terminal_energy_weight (CFS uses env.terminal_reward_weight).
  terminal_reward_weight: 120.0
  terminal_foot_penalty: 0.50
  terminal_foot_margin: 0.20
  start_mid: [-1.25, 0.0]
  goal_mid: [1.25, 0.0]
  control_limit: 0.45

method: cfsmbd_full
method_params:
  show_tqdm: true
  action_extra_sigma: 0.02
  max_constraints_per_point: 12
  # CFS activation buffer: keep small on thin stones to avoid over-early projection.
  constraint_margin: 0.01
  cfs_action_convexifier: cfs_action
  aug_lambda: 0.0
  aug_rho: 1.0
  num_modes: 8
  mode_strategy: multirun

obstacle_levels: [1]
obstacle_config:
  generator: stepping_stones_2d
  robot_radius: 0.03
  foothold_margin: 0.05
  success_margin: 0.20
  terminal_foot_margin: 0.20
  l_max: 0.35
  stance_width: 0.30
  k_horizon_cap: 16
  lane_tail_margin: 3
  lane_gap_scale: 0.97

seeds: [0]
backend: jax
device: cuda

metrics: [stepping_metrics]
visualizations: [stepping_trajectory, stepping_modes, cost, adaptive, diffusion]

scheduler_config:
  type: composite
  constraint_schedulers:
    - type: alm_adaptive
      # Stage 4: clearance shared by QP feet + ALM hook; 0.03 tends to match thin stones better than 0.05.
      margin: 0.02
      lam0: 0.0
      rho0: 1.0
      nu0: 0.0
      compute_cost_mode: product   # product | linear
      compute_cost_a0: 0.0
      compute_cost_aK: 1.0
      compute_cost_aI: 1.0
      compute_cost_use_qp_gate: true
      compute_budget_B: 6.0
      compute_budget_time_profile: constant   # constant | gaussian_bump
      compute_budget_time_amp: 2.0
      compute_budget_time_mu: 0.5
      compute_budget_time_sigma: 0.2
      eta_nu: 0.05
      nu_max: 0.0

      # Non-monotone ALM (λ forgetting + ρ hysteresis)
      eta_lam_forget: 0.02
      rho_min: 0.5
      rho_tau_hi: 5.0e-4
      rho_tau_lo: 1.0e-4
      rho_gamma_up: 2.0
      rho_gamma_down: 1.5
      rho_good_steps: 5
      gamma: 2.0
      rho_max: 500.0
      kappa: 0.9
      r_tol: 5e-4

      # Non-monotone controller (v_k-based)
      v_signal_mode: mean   # rate | mean
      v_star: 0.03
      v_ema_beta: 0.3
      v_tau_hi: 0.08
      v_tau_lo: 0.03

      # p controller: non-monotone response to dv and v-v*
      eta_p: 2.0
      eta_p_plus: 1.0
      eta_p_minus: 0.8
      eta_c_p: 0.2

      # topK controller
      eta_topK: 10.0
      eta_topK_plus: 10.0
      eta_topK_minus: 2.0
      eta_c_topK: 1.0

      # I controller
      eta_I: 8.0
      eta_I_plus: 8.0
      eta_I_minus: 2.0
      eta_c_I: 1.0

      # eps controller (smaller eps = more accurate)
      eta_eps: 0.01
      eta_eps_plus: 0.01
      eta_eps_minus: 0.003
      eta_c_eps: 0.01

      p_min: 0.0
      # Keep CFS from saturating to always-on in stepping-stones.
      p_max: 1.0
      eps_min: 1e-5
      eps_max: 1e-2
      I_min: 1
      I_max: 10
      topK_min: 1
      topK_max: 10
      use_stochastic_gate: true
  diffusion_schedulers:
    - type: fixed
      M_k: 512
      T_k: 0.3
      Ndiffuse: 100
      beta0: 1e-5
      betaT: 1e-2
  constraint_merge_strategy: merge
  diffusion_merge_strategy: merge

