name: quadruped_stepping_stones_2d_mdcoas_smoke
output_dir: results/quadruped/stepping_stones_2d/smoke/mdcoas

env_name: quadruped_stepping_stones_2d
env_params:
  dt: 1.0
  horizon: 36
  l_max: 0.35
  body_shift_limit: 0.24
  stance_width: 0.30
  terminal_foot_penalty: 0.50
  terminal_foot_margin: 0.20
  start_mid: [-1.25, 0.0]
  goal_mid: [1.25, 0.0]
  control_limit: 0.45

method: cfsmbd_full
method_params:
  show_tqdm: true
  action_extra_sigma: 0.02
  max_constraints_per_point: 12
  constraint_margin: 0.05
  cfs_action_convexifier: cfs_action
  aug_lambda: 0.0
  aug_rho: 1.0
  num_modes: 8
  mode_strategy: multirun

obstacle_levels: [1]
obstacle_config:
  generator: stepping_stones_2d
  robot_radius: 0.03
  foothold_margin: 0.05
  success_margin: 0.12
  terminal_foot_margin: 0.20
  l_max: 0.35
  stance_width: 0.30

seeds: [0]
backend: jax
device: cuda

metrics: [stepping_metrics]
visualizations: [stepping_trajectory, stepping_modes]

scheduler_config:
  type: composite
  constraint_schedulers:
    - type: alm_adaptive
      margin: 0.05
      lam0: 0.0
      rho0: 1.0
      nu0: 0.0
      rho_min: 0.5
      rho_max: 400.0
      use_stochastic_gate: true
  diffusion_schedulers:
    - type: fixed
      M_k: 64
      T_k: 0.12
      Ndiffuse: 24
      beta0: 1e-5
      betaT: 1e-2
  constraint_merge_strategy: merge
  diffusion_merge_strategy: merge

