# ── Baseline: MBD + progress guidance ──
name: quadruped_stepping_stones_2d_mbd_smoke
output_dir: results/quadruped/stepping_stones_2d/smoke/mbd

env_name: quadruped_stepping_stones_2d
env_params:
  dt: 1.0
  horizon: 16
  l_max: 0.35
  body_shift_limit: 0.24
  stance_width: 0.30
  # Match cfsmbd_full: CFS reads terminal reward from env; MBD uses method_params.terminal_energy_weight below.
  terminal_reward_weight: 120.0
  terminal_foot_penalty: 0.50
  terminal_foot_margin: 0.20
  start_mid: [-1.25, 0.0]
  goal_mid: [1.25, 0.0]
  control_limit: 0.45

method: mbd
method_params:
  show_tqdm: true
  action_extra_sigma: 0.02
  terminal_energy_weight: 120.0
  guide_weight: 20.0
  num_modes: 8
  mode_strategy: multirun

obstacle_levels: [1]
obstacle_config:
  generator: stepping_stones_2d
  robot_radius: 0.03
  foothold_margin: 0.05
  success_margin: 0.20
  terminal_foot_margin: 0.20
  l_max: 0.35
  stance_width: 0.30
  # Align scene k_horizon with env horizon; slightly tighter spacing vs default easy profile
  k_horizon_cap: 16
  lane_tail_margin: 3
  lane_gap_scale: 0.97

seeds: [0]
backend: jax
device: cuda

metrics: [stepping_metrics]
visualizations: [stepping_trajectory, stepping_modes, cost, diffusion]

scheduler_config:
  type: composite
  diffusion_schedulers:
    - type: fixed
      M_k: 512
      T_k: 0.3
      Ndiffuse: 100
      beta0: 1e-5
      betaT: 1e-2
  diffusion_merge_strategy: merge

