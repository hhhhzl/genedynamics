name: quadruped_stepping_stones_governed_ebmbd
# Plan -> stepping reference governor -> walker (follow_gait_reference) execution.
# Run with: scripts/tasks/robot/quadruped/stepping_tones/run_stepping_execution.py exec --config <this>

output_dir: results/quadruped/stepping_stones_2d/deploy/governed/ebmbd
exec_mode: both              # governed | raw | both  (raw = follow_plan baseline, expected to fail)

robot_type: quadruped
model_id: go2

env_params:
  # Planner output to execute (expects trajectory/trajectory.json with candidate_states + best_idx).
  plan_seed_dir: results/quadruped/stepping_stones_2d/smoke/ebmbd/level_1/seed_0
  # Scene reconstruction (used if the seed dir has no execution_results.stepping_scene).
  l_max: 0.35
  stance_width: 0.30
  start_mid: [-1.25, 0.0]
  goal_mid: [1.25, 0.0]

# Any MinimalFollowerConfig field. Values below are the sim-validated execution config.
walker:
  gait: walk
  sim_dt: 0.01
  phase_steps: 36
  step_width: 0.30
  settle_steps: 30
  goal_hold_steps: 40
  swing_height: 0.045
  swing_stance_phase: 0.5
  # body-path tracking (higher closes the goal lag)
  base_kp_xy: 70.0
  base_kd_xy: 16.0
  # touchdown / abort backstop (governed path uses a contact-based timeout)
  touchdown_xy_tol: 0.06
  abort_after_consecutive_timeouts: 2

# Any GovernorConfig field (optional; geometry defaults follow `walker`).
governor:
  stride_length: 0.22          # body advance per gait cycle (~ stone pitch)
  swing_step_limit: 0.35       # hard per-swing bound (= l_max)
  stone_interior_clearance: 0.025
  project_to_stones: true

render:
  enabled: true
  width: 480
  height: 360
  max_frames: 120
