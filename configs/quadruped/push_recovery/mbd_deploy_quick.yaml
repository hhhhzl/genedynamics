# Quadruped push_recovery MBD deploy quick (Ant, reduced samples)
# Run: genedynamics-deploy --config configs/quadruped/push_recovery/mbd_deploy_quick.yaml

name: quadruped_push_recovery_quick
output_dir: results/deploy/quadruped_push_recovery

start_mode: near_target
start_min_dist: 0.5
start_max_dist: 1.0

method: mbd
env_name: quadruped_flat_mjx
env_params:
  dt: 0.05
  horizon: 48
  target: [2.0, 0.0, 0.5]
  control_limit: 1.0
  model: ant

method_params:
  terminal_energy_weight: 1500.0

scheduler_config:
  type: composite
  diffusion_schedulers:
    - type: fixed
      M_k: 128
      T_k: 0.1
      Ndiffuse: 30
      beta0: 1e-5
      betaT: 1e-2
  diffusion_merge_strategy: merge

task:
  task_type: push_recovery
  perturbation:
    impulse_magnitude: 15.0
    interval_steps: [10, 25]
    body: torso
    direction_randomize: true

execution_mode: sim_only
control_rate_hz: 20.0
plan_rate_hz: 10.0
record: true
horizon: 48
