# Quadruped push_recovery MBD deploy
# Run: genedynamics-deploy --config configs/quadruped/push_recovery/mbd_deploy.yaml

name: quadruped_push_recovery
output_dir: results/deploy/quadruped_push_recovery

start_mode: near_target
start_min_dist: 0.5
start_max_dist: 1.0

env_params:
  dt: 0.05
  horizon: 64
  target: [2.0, 0.0, 0.5]
  control_limit: 1.0
  model: ant

method: mbd
method_params:
  terminal_energy_weight: 1500.0

scheduler_config:
  type: composite
  diffusion_schedulers:
    - type: fixed
      M_k: 512
      T_k: 0.1
      Ndiffuse: 100
      beta0: 1e-5
      betaT: 1e-2
  diffusion_merge_strategy: merge

task:
  task_type: push_recovery
  perturbation:
    impulse_magnitude: 15.0
    interval_steps: [20, 60]
    body: torso
    direction_randomize: true

execution_mode: sim_only
control_rate_hz: 20.0
plan_rate_hz: 10.0
record: true
horizon: 64
