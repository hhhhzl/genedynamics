# Quadruped flat MBD pure plan (Go2) - long-run point-target
# Run: MUJOCO_GL=osmesa python -m genedynamics.experiments.runner configs/quadruped/flat/mbd_plan_go2.yaml
#
# Requires: third_party/mujoco_menagerie (git clone) or MUJOCO_MENAGERIE_PATH (Unitree Go2 MJCF).
# Render: python scripts/visualizations/render_deploy_quadruped_gif.py results/quadruped/flat/mbd_plan_go2/... --model go2
# Or use trajectory_3d visualization (experiment runner outputs trajectory_3d.png).

name: quadruped_flat_mbd_plan_go2
output_dir: results/quadruped/flat/mbd_plan_go2

env_name: quadruped_go2_mjx
env_params:
  dt: 0.03
  horizon: 72
  target: [4.5, 0.0, 0.28]
  control_limit: 0.05
  physics_backend: mjx
  model: go2

method: mbd
method_params:
  action_extra_sigma: 0.01
  terminal_energy_weight: 6500.0
  show_tqdm: true

obstacle_levels: [0, 1, 2]
obstacle_config:
  generator: box3d
  robot_radius: 0.20
  success_margin: 0.8
  obstacle_radius_scale: 1.2
  p_max: 8.0
  obstacle_type: sphere
  map_bounds:
    x_min: -2.0
    x_max: 8.0
    y_min: -3.0
    y_max: 3.0
    z_min: 0.0
    z_max: 1.2

scheduler_config:
  type: composite
  diffusion_schedulers:
    - type: fixed
      M_k: 48
      T_k: 0.06
      Ndiffuse: 10
      beta0: 1e-5
      betaT: 1e-2
  diffusion_merge_strategy: merge

metadata:
  start_strategy: behind_target_x
  start_min_dist: 0.8
  start_max_dist: 1.0
  start_dist_level_scale: 0.2

seeds: [0]
backend: jax
device: cuda

metrics: [ssr, obstacle_density]
visualizations: [trajectory_3d, motion_replay]
