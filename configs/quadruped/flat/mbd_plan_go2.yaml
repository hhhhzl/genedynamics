# Quadruped flat MBD pure plan (Go2) - real Unitree Go2 model
# Run: python -m genedynamics.experiments.runner configs/quadruped/flat/mbd_plan_go2.yaml
#
# Requires: MUJOCO_MENAGERIE_PATH or mujoco-menagerie (Unitree Go2 MJCF).
# Render: python scripts/render_deploy_quadruped_gif.py results/quadruped/flat/mbd_plan_go2/... --model go2
# Or use trajectory_3d visualization (experiment runner outputs trajectory_3d.png).

name: quadruped_flat_mbd_plan_go2
output_dir: results/quadruped/flat/mbd_plan_go2

env_name: quadruped_go2_mjx
env_params:
  dt: 0.05
  horizon: 64  # Go2: longer horizon for smoother gait
  target: [2.0, 0.0, 0.5]
  control_limit: 1.0
  physics_backend: mjx
  model: go2

method: mbd
method_params:
  action_extra_sigma: 0.15
  terminal_energy_weight: 5000.0
  show_tqdm: true

obstacle_levels: [0, 1, 2]
obstacle_config:
  generator: box3d
  robot_radius: 0.15
  success_margin: 0.7
  obstacle_radius_scale: 1.2
  p_max: 2.0
  obstacle_type: sphere
  map_bounds:
    x_min: -1.5
    x_max: 2.5
    y_min: -1.5
    y_max: 1.5
    z_min: 0.0
    z_max: 1.0

scheduler_config:
  type: composite
  diffusion_schedulers:
    - type: fixed
      M_k: 512
      T_k: 0.1
      Ndiffuse: 100
      beta0: 1e-5
      betaT: 1e-2
  diffusion_merge_strategy: merge

seeds: [0]
backend: jax
device: cpu

metrics: [ssr, obstacle_density]
visualizations: [trajectory_3d]
