# Quadruped flat MD-COAS (cfsmbd_full) pure plan (Ant)
# Run: python -m genedynamics.experiments.runner configs/quadruped/flat/mdcoas_plan.yaml
#
# To extend trajectory: increase env_params.horizon (e.g. 64, 80).

name: quadruped_flat_mdcoas_plan
output_dir: results/quadruped/flat/mdcoas_plan

env_name: quadruped_flat_mjx
env_params:
  dt: 0.05
  horizon: 48  # Increase for longer trajectory (64, 80, 96)
  target: [2.0, 0.0, 0.5]
  control_limit: 1.0
  physics_backend: mjx

method: cfsmbd_full
method_params:
  show_tqdm: true
  action_extra_sigma: 0.3
  max_constraints_per_point: 8
  constraint_margin: 0.25
  cfs_action_convexifier: cfs_action
  aug_lambda: 0.0
  aug_rho: 1.0

obstacle_levels: [0, 1, 2]
obstacle_config:
  generator: box3d
  robot_radius: 0.15
  success_margin: 0.7
  obstacle_radius_scale: 1.2
  p_max: 2.0
  obstacle_type: sphere
  map_bounds:
    x_min: -1.5
    x_max: 2.5
    y_min: -1.5
    y_max: 1.5
    z_min: 0.0
    z_max: 1.0

scheduler_config:
  type: composite
  constraint_schedulers:
    - type: alm_adaptive
      margin: 0.25
      lam0: 0.0
      rho0: 1.0
      nu0: 0.0
      compute_cost_mode: product
      compute_cost_a0: 0.0
      compute_cost_aK: 1.0
      compute_cost_aI: 1.0
      compute_cost_use_qp_gate: false
      compute_budget_B: 8.0
      compute_budget_time_profile: constant
      compute_budget_time_amp: 2.0
      compute_budget_time_mu: 0.5
      compute_budget_time_sigma: 0.2
      eta_nu: 0.05
      nu_max: 0.0
      eta_lam_forget: 0.02
      rho_min: 0.5
      rho_tau_hi: 5.0e-4
      rho_tau_lo: 1.0e-4
      rho_gamma_up: 2.0
      rho_gamma_down: 1.5
      rho_good_steps: 5
      gamma: 2.0
      rho_max: 500.0
      kappa: 0.9
      r_tol: 5e-4
      v_signal_mode: rate
      v_star: 0.0
      v_ema_beta: 0.3
      v_tau_hi: 0.05
      v_tau_lo: 0.01
      eta_p: 2.0
      eta_p_plus: 2.0
      eta_p_minus: 0.3
      eta_c_p: 0.2
      eta_topK: 10.0
      eta_topK_plus: 10.0
      eta_topK_minus: 2.0
      eta_c_topK: 1.0
      eta_I: 8.0
      eta_I_plus: 8.0
      eta_I_minus: 2.0
      eta_c_I: 1.0
      eta_eps: 0.01
      eta_eps_plus: 0.01
      eta_eps_minus: 0.003
      eta_c_eps: 0.01
      p_min: 0.0
      p_max: 1.0
      eps_min: 1e-5
      eps_max: 1e-2
      I_min: 1
      I_max: 5
      topK_min: 1
      topK_max: 8
      use_stochastic_gate: true
  diffusion_schedulers:
    - type: fixed
      M_k: 256
      T_k: 0.2
      Ndiffuse: 60
      beta0: 1e-5
      betaT: 1e-2
  constraint_merge_strategy: merge
  diffusion_merge_strategy: merge

seeds: [0]
backend: jax
device: cpu

metrics: [ssr, obstacle_density]
visualizations: [trajectory_3d]
