# Quadruped flat MBD locomotion plan (Ant, forward-x task)
# Run: MUJOCO_GL=osmesa python -m genedynamics.experiments.runner configs/quadruped/flat/mbd_locomotion_plan.yaml

name: quadruped_flat_mbd_locomotion_plan
output_dir: results/quadruped/flat/mbd_locomotion_plan

env_name: quadruped_flat_mjx
env_params:
  dt: 0.05
  horizon: 96
  target: [4.5, 0.0, 0.75]
  desired_velocity: [0.9, 0.0, 0.0]
  control_limit: 0.9
  physics_backend: mjx

method: mbd
method_params:
  action_extra_sigma: 0.06
  terminal_energy_weight: 2500.0
  show_tqdm: true

obstacle_levels: [0, 1, 2]
obstacle_config:
  generator: box3d
  robot_radius: 0.15
  success_margin: 0.8
  obstacle_radius_scale: 1.2
  p_max: 8.0
  obstacle_type: sphere
  map_bounds:
    x_min: -2.0
    x_max: 8.0
    y_min: -3.0
    y_max: 3.0
    z_min: 0.0
    z_max: 1.2

scheduler_config:
  type: composite
  diffusion_schedulers:
    - type: fixed
      M_k: 128
      T_k: 0.06
      Ndiffuse: 24
      beta0: 1e-5
      betaT: 1e-2
  diffusion_merge_strategy: merge

metadata:
  start_strategy: behind_target_x
  start_min_dist: 3.8
  start_max_dist: 4.2
  start_dist_level_scale: 0.3

seeds: [0]
backend: jax
device: cuda

metrics: [ssr, obstacle_density]
visualizations: [trajectory_3d, motion_replay]
