# Quadruped flat MBD pure plan (Ant)
# Run: python -m genedynamics.experiments.runner configs/quadruped/flat/mbd_plan.yaml
#
# To extend trajectory: increase env_params.horizon (e.g. 64, 80).
# Trajectory length = horizon * dt (e.g. 48*0.05=2.4s, 64*0.05=3.2s).

name: quadruped_flat_mbd_plan
output_dir: results/quadruped/flat/mbd_plan

env_name: quadruped_flat_mjx
env_params:
  dt: 0.05
  horizon: 48  # Increase for longer trajectory (64, 80, 96)
  target: [2.0, 0.0, 0.5]
  control_limit: 1.0
  physics_backend: mjx

method: mbd
method_params:
  action_extra_sigma: 0.2
  terminal_energy_weight: 5000.0
  show_tqdm: true

obstacle_levels: [0, 1, 2]
obstacle_config:
  generator: box3d
  robot_radius: 0.15
  success_margin: 0.7
  obstacle_radius_scale: 1.2
  p_max: 2.0
  obstacle_type: sphere
  map_bounds:
    x_min: -1.5
    x_max: 2.5
    y_min: -1.5
    y_max: 1.5
    z_min: 0.0
    z_max: 1.0

scheduler_config:
  type: composite
  diffusion_schedulers:
    - type: fixed
      M_k: 256
      T_k: 0.08
      Ndiffuse: 60
      beta0: 1e-5
      betaT: 1e-2
  diffusion_merge_strategy: merge

seeds: [0]
backend: jax
device: cpu

metrics: [ssr, obstacle_density]
visualizations: [trajectory_3d]
