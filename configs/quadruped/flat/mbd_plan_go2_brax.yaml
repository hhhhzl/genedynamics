# Quadruped Go2 MBD with Brax physics (positional backend).
# Run: python -m genedynamics.experiments.runner configs/quadruped/flat/mbd_plan_go2_brax.yaml
# Requires: third_party/model-based-diffusion, third_party/dial-mpc, brax, jax.

name: quadruped_flat_mbd_plan_go2_brax
output_dir: results/quadruped/flat/mbd_plan_go2_brax

env_name: quadruped_go2_brax
env_params:
  dt: 0.03
  horizon: 72
  target: [4.5, 0.0, 0.28]
  physics_backend: brax

method: mbd
method_params:
  action_extra_sigma: 0.01
  terminal_energy_weight: 6500.0
  show_tqdm: true

scheduler_config:
  type: composite
  diffusion_schedulers:
    - type: fixed
      M_k: 48
      T_k: 0.06
      Ndiffuse: 10
      beta0: 1e-5
      betaT: 1e-2
  diffusion_merge_strategy: merge

obstacle_levels: [0]
obstacle_config:
  generator: box3d
  robot_radius: 0.20
  success_margin: 0.8
  map_bounds:
    x_min: -2.0
    x_max: 8.0
    y_min: -3.0
    y_max: 3.0
    z_min: 0.0
    z_max: 1.2

seeds: [0]
backend: jax
device: cuda

metrics: [ssr]
visualizations: [trajectory_3d, motion_replay]
