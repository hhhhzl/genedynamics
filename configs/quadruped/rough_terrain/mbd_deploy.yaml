# Quadruped rough_terrain MBD deploy
# Run: genedynamics-deploy --config configs/quadruped/rough_terrain/mbd_deploy.yaml

name: quadruped_rough_terrain
output_dir: results/deploy/quadruped_rough_terrain

start_mode: random

env_params:
  dt: 0.05
  horizon: 64
  target: [2.0, 0.0, 0.5]
  control_limit: 1.0
  model: ant

method: mbd
method_params:
  terminal_energy_weight: 1500.0

scheduler_config:
  type: composite
  diffusion_schedulers:
    - type: fixed
      M_k: 512
      T_k: 0.1
      Ndiffuse: 100
      beta0: 1e-5
      betaT: 1e-2
  diffusion_merge_strategy: merge

task:
  task_type: rough_terrain
  terrain:
    type: rough
    friction_randomize: false

execution_mode: sim_only
control_rate_hz: 20.0
plan_rate_hz: 10.0
record: true
horizon: 64
