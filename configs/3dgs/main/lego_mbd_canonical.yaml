name: 3dgs_lego_mbd_canonical
output_dir: results/3dgs/main/lego_mbd_canonical

env_name: 3dgs_nerf_synthetic
env_params:
  dataset_root: data/nerf_synthetic/lego
  object: lego
  use_stub_when_unavailable: false
  split: train
  eval_split: test
  max_views: 20
  view_stride: 1
  shuffle_seed: 0
  resolution_infer: 128
  resolution_eval: 512
  eval_resolution: 512
  composite_background: white
  pose_convention: opencv

method: mbd3d
method_params:
  horizon: 10
  n_gaussians: 128
  bridge_K: 200
  bridge_beta0: 0.0
  bridge_betaK: 1.0
  bridge_eta: 0.015
  bridge_eta_end: 0.005
  M: 8
  sigma_mcsa: 0.05
  ess_min: 1.0
  observation_sigma2: 0.005
  image_height: 128
  image_width: 128
  image_channels: 3
  use_lowrank_noise: true
  lowrank_view_rank: 3
  lowrank_spatial_rank: 1
  lowrank_color_rank: 3
  lowrank_max_rank: 16
  use_real_splat: true
  prefer_jax_renderer: true
  fix_cameras: true
  initialization_mode: prior_center
  init_jitter_scale: 1.0
  enable_subspace: true
  subspace_rank: 4
  subspace_rank_start: 2
  subspace_rank_end: 4
  subspace_power_iters: 1
  subspace_refresh_every: 1
  subspace_refresh_every_start: 1
  subspace_refresh_every_end: 4
  subspace_oversample: 2
  proposal_count_start: 6
  proposal_count_end: 8
  compile_stable_shapes: true
  profiling: true
  fidelity_ladder:
    - end_frac: 0.35
      downsample: 4
    - end_frac: 0.75
      downsample: 2
    - end_frac: 1.0
      downsample: 1
  prior_scale_means: 2.0
  prior_scale_scales: 0.5
  show_tqdm: true

obstacle_levels: [0]
obstacle_config:
  generator: box2d
  robot_radius: 0.05

seeds: [0]
backend: jax
device: cuda

metrics: []
visualizations: []

metadata:
  description: "Canonical MBD3D run on Lego without external pretraining."
  author: "genedynamics"
