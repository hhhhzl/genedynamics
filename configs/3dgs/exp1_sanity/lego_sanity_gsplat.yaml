name: exp1_sanity_lego_gsplat
output_dir: results/3dgs/exp1_sanity/lego_gsplat

env_name: 3dgs_nerf_synthetic
env_params:
  dataset_root: data/nerf_synthetic/lego
  object: lego
  use_stub_when_unavailable: false
  split: train
  eval_split: test
  perturb_target_split: train
  max_views: 100
  view_stride: 1
  shuffle_seed: 0
  resolution_infer: 128
  resolution_eval: 512
  eval_resolution: 512
  composite_background: white
  pose_convention: opencv

method: mbd3d
method_params:
  n_gaussians: 512

obstacle_levels: [0]
obstacle_config:
  generator: box2d
  robot_radius: 0.05

seeds: [0]
backend: jax
device: cuda

metadata:
  description: "Experiment 1 Part A: gsplat MAP baseline (run via train_gsplat.py / run_baseline_experiment.py)."
  experiment_part: sanity
