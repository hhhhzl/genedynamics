name: exp1_sanity_lego_mbd_iid
output_dir: results/3dgs/exp1_sanity/lego_mbd_iid

env_name: 3dgs_nerf_synthetic
env_params:
  dataset_root: data/nerf_synthetic/lego
  object: lego
  use_stub_when_unavailable: false
  split: train
  eval_split: test
  perturb_target_split: train
  max_views: 100
  view_stride: 1
  shuffle_seed: 0
  resolution_infer: 128
  resolution_eval: 512
  eval_resolution: 512
  composite_background: white
  pose_convention: opencv

method: mbd3d
method_params:
  n_gaussians: 512
  ess_min: 1.0
  observation_sigma2: 0.005
  image_height: 128
  image_width: 128
  image_channels: 3
  use_lowrank_noise: false
  lowrank_view_rank: 4
  lowrank_spatial_rank: 2
  lowrank_color_rank: 3
  lowrank_max_rank: 16
  use_real_splat: true
  prefer_jax_renderer: true
  fix_cameras: true
  enable_subspace: true
  subspace_rank: 64
  subspace_power_iters: 2
  subspace_refresh_every: 1
  extra_sigma_start: 0.00008
  extra_sigma_end: 0.00001
  show_tqdm: true

scheduler_config:
  type: composite
  diffusion_schedulers:
    - type: fixed
      Ndiffuse: 1200
      beta0: 1.0e-4
      betaT: 1.0e-2
      M_k: 16
      T_k: 1.0
  diffusion_merge_strategy: merge

seeds: [0]
backend: jax
device: cuda

metadata:
  description: "Experiment 1 Part A: sanity reconstruction, IID likelihood (clean-state MBD, no β tempering)."
  experiment_part: sanity
