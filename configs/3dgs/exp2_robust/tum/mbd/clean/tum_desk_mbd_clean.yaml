env_name: 3dgs_tum_rgbd
env_params:
  dataset_root: data/tum
  sequence: rgbd_dataset_freiburg1_desk
  use_stub_when_unavailable: false
  split: train
  eval_split: test
  perturb_target_split: train
  max_views: 100
  view_stride: 1
  shuffle_seed: 0
  resolution_infer: 128
  resolution_eval: 480
  composite_background: white
  pose_convention: opencv
  train_frac: 0.9
  max_time_diff: 0.02
method: mbd3d
method_params:
  n_gaussians: 4096
  ess_min: 2.0
  observation_sigma2: 0.0005
  image_height: 128
  image_width: 128
  image_channels: 3
  use_lowrank_noise: true
  lowrank_view_rank: 3
  lowrank_spatial_rank: 1
  lowrank_color_rank: 3
  lowrank_max_rank: 16
  use_real_splat: true
  prefer_jax_renderer: true
  prefer_external_jaxsplat: true
  fix_cameras: true
  initialization_mode: direct
  init_jitter_scale: 0.0
  enable_subspace: true
  subspace_rank: 64
  subspace_power_iters: 2
  subspace_refresh_every: 2
  proposal_count_start: 16
  proposal_count_end: 16
  compile_stable_shapes: true
  profiling: true
  show_tqdm: true
scheduler_config:
  type: composite
  diffusion_schedulers:
  - type: fixed
    Ndiffuse: 500
    beta0: 0.0001
    betaT: 0.01
    M_k: 16
    T_k: 1.0
  diffusion_merge_strategy: merge
seeds:
- 0
backend: jax
device: cuda
metrics: []
visualizations: []
name: tum_desk_mbd_clean
output_dir: results/3dgs/exp2_robust/tum/mbd/tum_desk_mbd_clean
metadata:
  description: TUM fr1_desk clean MBD3D
  warmstart_ckpt_key: tum_desk_mbd_clean
