# Base configuration for 3DGS NeRF Synthetic experiments.
# Inherited by lego_*, chair_* configs. Override env_params.dataset_root /
# .object and method-specific params (subspace_rank, observation_sigma2, …).

name: 3dgs_nerf_synth_base
output_dir: results/3dgs/nerf_synth

env_name: 3dgs_nerf_synthetic
env_params:
  dataset_root: null  # Override: e.g. data/nerf_synthetic/lego
  object: lego        # Override: lego | chair | drums | ficus | hotdog | materials | ship
  split: train
  eval_split: test    # Held-out views for metrics (unperturbed GT)
  max_views: 100
  view_stride: 1
  shuffle_seed: 0
  resolution_infer: 128
  resolution_eval: 512
  composite_background: white
  pose_convention: opencv
  # ---- Stress-test perturbations (optional, applied to perturb_target_split) ----
  # perturb_target_split: train
  # pose_bias_rotation_deg: 0.0
  # pose_bias_translation_m: 0.0
  # pose_bias_seed: 0
  # exposure_drift_mode: null         # constant_add | linear_gain
  # exposure_drift_strength: 0.0

method: mbd3d
method_params:
  n_gaussians: 512
  ess_min: 1.0
  observation_sigma2: 0.005
  image_height: 128
  image_width: 128
  image_channels: 3
  use_lowrank_noise: false  # true = correlated, false = iid
  lowrank_view_rank: 4
  lowrank_spatial_rank: 2
  lowrank_color_rank: 3
  lowrank_max_rank: 16
  use_real_splat: true
  prefer_jax_renderer: true
  fix_cameras: true
  enable_subspace: true
  subspace_rank: 64
  subspace_power_iters: 2
  subspace_refresh_every: 1
  extra_sigma_start: 0.00008
  extra_sigma_end: 0.00001
  show_tqdm: true

# DDPM noise schedule for the forward kernel q(θ_k|θ_1) (Eq 17, 19).
# Ndiffuse = K reverse steps; beta0/betaT define linear ᾱ_k decay;
# M_k Monte-Carlo candidates per step; T_k softmax temperature.
scheduler_config:
  type: composite
  diffusion_schedulers:
    - type: fixed
      Ndiffuse: 1000
      beta0: 1.0e-4
      betaT: 1.0e-2
      M_k: 16
      T_k: 1.0
  diffusion_merge_strategy: merge

seeds: [0]
backend: jax
device: cuda

metrics: []
visualizations: []

metadata:
  description: "3DGS NeRF Synthetic base config (clean-state MBD, no β tempering)."
  author: "genedynamics"
