# Part B: shared SE(3) pose bias on train observations; test metrics use clean GT (default perturb_target_split).
base_config: configs/3dgs/exp1_sanity/lego_sanity_mbd_corr.yaml
output_root: results/3dgs/stress_tests/pose_bias_mbd_corr
runs:
  - name: clean
    env_params: {}
  - name: pose_mild
    env_params:
      pose_bias_rotation_deg: 0.2
      pose_bias_translation_m: 0.01
      pose_bias_seed: 0
  - name: pose_medium
    env_params:
      pose_bias_rotation_deg: 0.5
      pose_bias_translation_m: 0.02
      pose_bias_seed: 0
  - name: pose_severe
    env_params:
      pose_bias_rotation_deg: 1.0
      pose_bias_translation_m: 0.05
      pose_bias_seed: 0
