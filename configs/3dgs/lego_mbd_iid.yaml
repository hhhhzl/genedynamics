# 3DGS Experiment 1: Lego - Ours-MBD (iid)
# Aligned with 3DGS setting, motivation experiment

name: 3dgs_lego_mbd_iid
output_dir: results/3dgs/lego_mbd_iid

env_name: 3dgs_nerf_synthetic
env_params:
  dataset_root: data/nerf_synthetic/lego  # Or absolute path
  object: lego
  use_stub_when_unavailable: false  # Use real NeRF data
  split: train
  max_views: 50  # 50-100 for experiment; use horizon+1 for MBD3D camera dim
  view_stride: 1
  shuffle_seed: 0
  resolution_infer: 128
  resolution_eval: 512
  composite_background: white
  pose_convention: opencv

method: mbd3d
method_params:
  horizon: 10
  n_gaussians: 32
  bridge_K: 50
  bridge_beta0: 0.0
  bridge_betaK: 1.0
  M: 16
  sigma_mcsa: 0.05
  ess_min: 1.0
  observation_sigma2: 0.01
  image_height: 128
  image_width: 128
  image_channels: 3
  use_lowrank_noise: false  # iid
  show_tqdm: true

obstacle_levels: [0]
obstacle_config:
  generator: box2d
  robot_radius: 0.05

seeds: [0]
backend: jax
device: cuda

metrics: []
visualizations: []

metadata:
  description: "Ours-MBD (iid) on NeRF Synthetic lego"
  author: "genedynamics"
